<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Choosing between Assess and Guided</title>
  <desc>Assess inspects the repository without changing it and returns Ready, Needs attention, or Blocked. Guided starts only after Assess is complete, release-critical blockers are resolved, and the user explicitly chooses to switch. Either mode works on one release profile: first-public for a private repository becoming public for the first time, or version-release for each new version of an already-public repository.</desc>
  <style>
    svg{ --bg:#F7F9FC; --ink:#1C2838; --muted:#607086; --edge:#8496AB;
         --blue:#2563A9; --blue-line:#75A6D1; --blue-ink:#183F68; --blue-tint:#E3EEF8;
         --amber:#9A5A16; --amber-line:#D69B51; --amber-ink:#70410F; --amber-tint:#FFF0DC;
         --purple-line:#8C79BF; --purple-ink:#49357C;
         --green-line:#5FA98B; --green-ink:#12513C;
         --card:#FFFFFF; }
    .h1{font-size:30px;font-weight:800;fill:var(--ink)}
    .sub{font-size:16px;fill:var(--muted)}
    .pill{font-size:13px;font-weight:800;letter-spacing:.4px}
    .name{font-size:21px;font-weight:800}
    .body{font-size:15px;fill:var(--muted)}
    .note{font-size:14px;fill:var(--muted)}
    .gate{font-size:14px;font-weight:700;fill:var(--amber-ink)}
    .lead{font-size:13px;font-weight:800;fill:var(--edge);letter-spacing:.4px}
  </style>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="1000" height="620" fill="var(--bg)"/>

  <rect x="40" y="34" width="5" height="52" rx="2.5" fill="var(--blue)"/>
  <text x="60" y="52" class="h1" dominant-baseline="central">Pick the mode first</text>
  <text x="60" y="82" class="sub" dominant-baseline="central">Assess never changes the repository. Guided changes only what you approve.</text>

  <text x="60" y="128" class="lead" dominant-baseline="central">CHOOSE ONE</text>

  <g>
    <rect x="60" y="146" width="400" height="150" rx="14" fill="var(--card)" stroke="var(--blue-line)" stroke-width="1.6"/>
    <rect x="60" y="147" width="400" height="33" rx="13" fill="var(--blue-tint)"/>
    <text x="82" y="164" class="pill" fill="var(--blue-ink)" dominant-baseline="central">READ ONLY</text>
    <text x="82" y="212" class="name" fill="var(--blue-ink)" dominant-baseline="central">Assess</text>
    <text x="82" y="244" class="body" dominant-baseline="central">Checks readiness and blockers, changes nothing.</text>
    <text x="82" y="268" class="body" dominant-baseline="central">Returns Ready, Needs attention, or Blocked.</text>
  </g>

  <g>
    <rect x="540" y="146" width="400" height="150" rx="14" fill="var(--card)" stroke="var(--amber-line)" stroke-width="1.6"/>
    <rect x="540" y="147" width="400" height="33" rx="13" fill="var(--amber-tint)"/>
    <text x="562" y="164" class="pill" fill="var(--amber-ink)" dominant-baseline="central">CHANGES THE REPOSITORY</text>
    <text x="562" y="212" class="name" fill="var(--amber-ink)" dominant-baseline="central">Guided</text>
    <text x="562" y="244" class="body" dominant-baseline="central">Shows each change first, then carries out only</text>
    <text x="562" y="268" class="body" dominant-baseline="central">what you approve — one change at a time.</text>
  </g>

  <path d="M740 356V304" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-primary)" data-flow="primary"/>

  <g>
    <rect x="500" y="356" width="440" height="126" rx="14" fill="var(--amber-tint)" stroke="var(--amber-line)" stroke-width="1.6"/>
    <text x="524" y="384" class="pill" fill="var(--amber-ink)" dominant-baseline="central">BEFORE GUIDED — ALL THREE</text>
    <text x="524" y="414" class="gate" dominant-baseline="central">1 · Assess is complete</text>
    <text x="524" y="440" class="gate" dominant-baseline="central">2 · Release-critical blockers are resolved</text>
    <text x="524" y="466" class="gate" dominant-baseline="central">3 · You explicitly choose to switch</text>
  </g>

  <text x="60" y="372" class="lead" dominant-baseline="central">EITHER MODE</text>
  <text x="60" y="400" class="note" dominant-baseline="central">Both modes work on one release profile.</text>

  <g>
    <rect x="60" y="420" width="200" height="62" rx="12" fill="var(--card)" stroke="var(--purple-line)" stroke-width="1.6"/>
    <text x="82" y="442" class="pill" fill="var(--purple-ink)" dominant-baseline="central">FIRST-PUBLIC</text>
    <text x="82" y="464" class="note" dominant-baseline="central">Private → public, once</text>
  </g>
  <g>
    <rect x="276" y="420" width="200" height="62" rx="12" fill="var(--card)" stroke="var(--green-line)" stroke-width="1.6"/>
    <text x="298" y="442" class="pill" fill="var(--green-ink)" dominant-baseline="central">VERSION-RELEASE</text>
    <text x="298" y="464" class="note" dominant-baseline="central">Each new version</text>
  </g>

  <rect x="60" y="514" width="880" height="70" rx="12" fill="var(--card)" stroke="#DCE3EC" stroke-width="1.4"/>
  <text x="84" y="540" class="note" fill="var(--ink)" font-weight="700" dominant-baseline="central">Asking for a change while in Assess does not start one.</text>
  <text x="84" y="564" class="note" dominant-baseline="central">The guide declines it and offers the switch to Guided instead. Only github.com is supported.</text>
</svg>
