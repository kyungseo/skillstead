<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>How Guided carries out one change</title>
  <desc>Guided begins after Assess. For one change it previews the action, rechecks the preconditions immediately before acting, asks for execution approval when a repository command must run, asks separately for mutation approval, carries out only what was previewed, and verifies the observed result before moving on or stopping. If any critical precondition changed at the recheck, the prior approval is void and the flow returns to preview.</desc>
  <style>
    svg{ --bg:#F7F9FC; --ink:#1C2838; --muted:#607086; --edge:#8496AB;
         --blue-line:#75A6D1; --blue-ink:#183F68; --blue-tint:#E3EEF8;
         --amber:#9A5A16; --amber-line:#D69B51; --amber-ink:#70410F; --amber-tint:#FFF0DC;
         --green-line:#5FA98B; --green-ink:#12513C; --green-tint:#E5F3EC;
         --card:#FFFFFF; }
    .h1{font-size:30px;font-weight:800;fill:var(--ink)}
    .sub{font-size:16px;fill:var(--muted)}
    .lead{font-size:13px;font-weight:800;fill:var(--edge);letter-spacing:.4px}
    .step{font-size:17px;font-weight:800;fill:var(--blue-ink)}
    .approve{font-size:17px;font-weight:800;fill:var(--amber-ink)}
    .verify{font-size:17px;font-weight:800;fill:var(--green-ink)}
    .body{font-size:13.5px;fill:var(--muted)}
    .tag{font-size:12px;font-weight:800;letter-spacing:.4px}
    .back{font-size:13px;font-weight:700;fill:var(--amber-ink)}
    .branch{font-size:13px;font-weight:700;fill:var(--edge)}
    .note{font-size:14px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow-detail" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#D69B51" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-regular" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="1000" height="660" fill="var(--bg)"/>

  <rect x="40" y="34" width="5" height="52" rx="2.5" fill="var(--amber)"/>
  <text x="60" y="52" class="h1" dominant-baseline="central">One change at a time, in Guided</text>
  <text x="60" y="82" class="sub" dominant-baseline="central">Two approval types, each scoped to what was previewed.</text>

  <!-- Assess is the entry condition, not a step of this loop -->
  <g>
    <rect x="60" y="124" width="272" height="44" rx="22" fill="var(--blue-tint)" stroke="var(--blue-line)" stroke-width="1.4"/>
    <text x="82" y="146" class="tag" fill="var(--blue-ink)" dominant-baseline="central">GUIDED ENTRY CONDITIONS MET</text>
  </g>
  <path d="M332 146H376" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-regular)" data-flow="regular"/>
  <text x="390" y="146" class="note" dominant-baseline="central">then, for each change:</text>

  <!-- row 1: preview and recheck -->
  <g>
    <rect x="60" y="196" width="270" height="96" rx="14" fill="var(--card)" stroke="var(--blue-line)" stroke-width="1.6"/>
    <text x="82" y="224" class="step" dominant-baseline="central">Preview</text>
    <text x="82" y="250" class="body" dominant-baseline="central">The exact action and target, its</text>
    <text x="82" y="270" class="body" dominant-baseline="central">impact, and the rollback route.</text>
  </g>
  <path d="M330 244H386" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-primary)" data-flow="primary"/>
  <g>
    <rect x="392" y="196" width="270" height="96" rx="14" fill="var(--card)" stroke="var(--blue-line)" stroke-width="1.6"/>
    <text x="414" y="224" class="step" dominant-baseline="central">Recheck</text>
    <text x="414" y="250" class="body" dominant-baseline="central">Visibility, ref, tag and settings,</text>
    <text x="414" y="270" class="body" dominant-baseline="central">read again just before acting.</text>
  </g>

  <!-- the return loop runs above the row, which leaves the band below free for the branch -->
  <path d="M527 196V176H196V190" fill="none" stroke="#D69B51" stroke-width="2.5" stroke-dasharray="5 3.75" stroke-dashoffset="7.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-detail)" data-flow="detail"/>
  <text x="556" y="176" class="back" dominant-baseline="central">State changed → return to Preview; approvals do not carry over</text>

  <!-- recheck branches: the execution approval is only on the path that runs a command -->
  <path d="M460 292V344H196V388" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-regular)" data-flow="regular"/>
  <text x="206" y="330" class="branch" dominant-baseline="central">if a command must run</text>
  <path d="M594 292V388" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-regular)" data-flow="regular"/>
  <text x="610" y="330" class="branch" dominant-baseline="central">if none is needed</text>

  <g>
    <rect x="60" y="396" width="270" height="104" rx="14" fill="var(--amber-tint)" stroke="var(--amber-line)" stroke-width="1.8"/>
    <text x="82" y="422" class="tag" fill="var(--amber-ink)" dominant-baseline="central">ONLY ON THE COMMAND PATH</text>
    <text x="82" y="450" class="approve" dominant-baseline="central">Execution approval</text>
    <text x="82" y="476" class="body" dominant-baseline="central">Covers that one command only.</text>
  </g>
  <path d="M330 448H386" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-regular)" data-flow="regular"/>
  <g>
    <rect x="392" y="396" width="270" height="104" rx="14" fill="var(--amber-tint)" stroke="var(--amber-line)" stroke-width="1.8"/>
    <text x="414" y="422" class="tag" fill="var(--amber-ink)" dominant-baseline="central">BEFORE ANY CHANGE</text>
    <text x="414" y="450" class="approve" dominant-baseline="central">Mutation approval</text>
    <text x="414" y="476" class="body" dominant-baseline="central">Always asked, on either path.</text>
  </g>
  <path d="M662 448H718" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-regular)" data-flow="regular"/>
  <g>
    <rect x="724" y="396" width="216" height="104" rx="14" fill="var(--card)" stroke="var(--blue-line)" stroke-width="1.6"/>
    <text x="746" y="436" class="step" dominant-baseline="central">Apply</text>
    <text x="746" y="464" class="body" dominant-baseline="central">Only what was previewed.</text>
  </g>

  <!-- row 3: verify, then the branch that ends the unit -->
  <!-- Apply hands off to Verify; the run sits in the gap between the rows so it crosses no card -->
  <path d="M832 500V521H196V536" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-primary)" data-flow="primary"/>
  <g>
    <rect x="60" y="542" width="270" height="94" rx="14" fill="var(--green-tint)" stroke="var(--green-line)" stroke-width="1.8"/>
    <text x="82" y="570" class="verify" dominant-baseline="central">Verify</text>
    <text x="82" y="596" class="body" dominant-baseline="central">Confirm the observed result,</text>
    <text x="82" y="616" class="body" dominant-baseline="central">not the expected one.</text>
  </g>
  <path d="M330 589H386" fill="none" stroke="#8496AB" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-regular)" data-flow="regular"/>

  <g>
    <rect x="392" y="542" width="270" height="94" rx="14" fill="var(--card)" stroke="#DCE3EC" stroke-width="1.6"/>
    <text x="414" y="570" class="tag" fill="var(--ink)" dominant-baseline="central">THEN ONE OF TWO</text>
    <text x="414" y="596" class="body" dominant-baseline="central">Next change — back to Preview</text>
    <text x="414" y="618" class="body" dominant-baseline="central">Stop — nothing further is done</text>
  </g>

  <g>
    <rect x="700" y="542" width="240" height="94" rx="14" fill="var(--amber-tint)" stroke="var(--amber-line)" stroke-width="1.6"/>
    <text x="722" y="570" class="tag" fill="var(--amber-ink)" dominant-baseline="central">GOING PUBLIC</text>
    <text x="722" y="596" class="body" dominant-baseline="central">Asked for separately, and</text>
    <text x="722" y="616" class="body" dominant-baseline="central">a public copy cannot be recalled.</text>
  </g>
</svg>
