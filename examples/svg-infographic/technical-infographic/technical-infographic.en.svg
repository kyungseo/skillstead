<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>The 4 Layers of AI Engineering</title>
  <desc>Four nested layers of AI engineering. Loop wraps Harness, Harness wraps Context, and Context wraps Prompt — so each outer layer only pays off once the layer inside it is in place.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD; --icon-tint:#E3EEF8; --card-line:#C9DCEE;
      --r1-fill:#EAF2FA; --r1-line:#C3DAF0; --r1-ink:#2C5B85;
      --r2-fill:#D8E8F7; --r2-line:#A6C9E7; --r2-ink:#23527C;
      --r3-fill:#B9D6F0; --r3-line:#8AB6DE; --r3-ink:#17436E;
      --r4-fill:#1F6FB2; --r4-line:#17588F; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:46px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:19px }
    .ring-label{ font-size:24px; font-weight:700 }
    .core-label{ font-size:26px; font-weight:700 }
    .c-title{ fill:var(--ink); font-size:25px; font-weight:700 }
    .c-body{ fill:var(--muted); font-size:19px }
    .c-num{ fill:var(--primary); font-size:28px; font-weight:700 }
    .caption{ fill:var(--muted); font-size:16px }
  </style>

  <defs>
    <symbol id="ic-prompt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l4.5 5L5 17"/><path d="M12.5 17H19"/></symbol>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="var(--bg)"/>

  <!-- header: rail derived from eyebrowTop(68) and titleBottom(147) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="48" y="52" width="6" height="95" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="76" y="76" font-size="16" dominant-baseline="middle">CONCEPT MAP</text>
    <text data-layout-role="title-line" class="h1" x="76" y="124" font-size="46" dominant-baseline="middle">The 4 Layers of AI Engineering</text>
    <text data-layout-role="title-subtitle" class="sub" x="76" y="182" font-size="19" dominant-baseline="middle">Each layer wraps the one inside it.</text>
  </g>

  <!-- nested rings: uniform 56px inset per ring -->
  <rect x="162" y="236" width="756" height="504" rx="28" fill="var(--r1-fill)" stroke="var(--r1-line)" stroke-width="1"/>
  <text class="ring-label" x="540" y="264" text-anchor="middle" dominant-baseline="central" fill="var(--r1-ink)">Loop</text>

  <rect x="218" y="292" width="644" height="392" rx="24" fill="var(--r2-fill)" stroke="var(--r2-line)" stroke-width="1"/>
  <text class="ring-label" x="540" y="320" text-anchor="middle" dominant-baseline="central" fill="var(--r2-ink)">Harness</text>

  <rect x="274" y="348" width="532" height="280" rx="20" fill="var(--r3-fill)" stroke="var(--r3-line)" stroke-width="1"/>
  <text class="ring-label" x="540" y="376" text-anchor="middle" dominant-baseline="central" fill="var(--r3-ink)">Context</text>

  <rect x="330" y="404" width="420" height="168" rx="16" fill="var(--r4-fill)" stroke="var(--r4-line)" stroke-width="1"/>
  <circle cx="540" cy="462" r="34" fill="#FFFFFF" fill-opacity="0.18"/>
  <use href="#ic-prompt" x="520" y="442" width="40" height="40" style="color:#FFFFFF"/>
  <text class="core-label on-accent" x="540" y="528" text-anchor="middle" dominant-baseline="central">Prompt</text>

  <!-- card 1 -->
  <g data-layout-role="icon-text-card" data-layout-center-y="878">
    <rect data-layout-role="card-frame" x="56" y="788" width="468" height="180" rx="24" fill="var(--card)" stroke="var(--card-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle data-layout-role="icon-center" cx="128" cy="878" r="34" fill="var(--icon-tint)"/>
    <text class="c-num" x="128" y="878" text-anchor="middle" dominant-baseline="middle">1</text>
    <text data-layout-role="card-title" class="c-title" x="180" y="848" font-size="25" dominant-baseline="middle">Prompt Engineering</text>
    <text data-layout-role="card-body" class="c-body" x="180" y="886" font-size="19" dominant-baseline="middle"><tspan x="180" dy="0">The exact words, instructions,</tspan><tspan x="180" dy="26">and constraints you type in.</tspan></text>
  </g>

  <!-- card 2 -->
  <g data-layout-role="icon-text-card" data-layout-center-y="878">
    <rect data-layout-role="card-frame" x="556" y="788" width="468" height="180" rx="24" fill="var(--card)" stroke="var(--card-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle data-layout-role="icon-center" cx="628" cy="878" r="34" fill="var(--icon-tint)"/>
    <text class="c-num" x="628" y="878" text-anchor="middle" dominant-baseline="middle">2</text>
    <text data-layout-role="card-title" class="c-title" x="680" y="848" font-size="25" dominant-baseline="middle">Context Engineering</text>
    <text data-layout-role="card-body" class="c-body" x="680" y="886" font-size="19" dominant-baseline="middle"><tspan x="680" dy="0">System prompt, reference files,</tspan><tspan x="680" dy="26">and history read beforehand.</tspan></text>
  </g>

  <!-- card 3 -->
  <g data-layout-role="icon-text-card" data-layout-center-y="1090">
    <rect data-layout-role="card-frame" x="56" y="1000" width="468" height="180" rx="24" fill="var(--card)" stroke="var(--card-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle data-layout-role="icon-center" cx="128" cy="1090" r="34" fill="var(--icon-tint)"/>
    <text class="c-num" x="128" y="1090" text-anchor="middle" dominant-baseline="middle">3</text>
    <text data-layout-role="card-title" class="c-title" x="180" y="1060" font-size="25" dominant-baseline="middle">Harness Engineering</text>
    <text data-layout-role="card-body" class="c-body" x="180" y="1098" font-size="19" dominant-baseline="middle"><tspan x="180" dy="0">Code that routes tools, checks</tspan><tspan x="180" dy="26">output, and retries on its own.</tspan></text>
  </g>

  <!-- card 4 -->
  <g data-layout-role="icon-text-card" data-layout-center-y="1090">
    <rect data-layout-role="card-frame" x="556" y="1000" width="468" height="180" rx="24" fill="var(--card)" stroke="var(--card-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle data-layout-role="icon-center" cx="628" cy="1090" r="34" fill="var(--icon-tint)"/>
    <text class="c-num" x="628" y="1090" text-anchor="middle" dominant-baseline="middle">4</text>
    <text data-layout-role="card-title" class="c-title" x="680" y="1060" font-size="25" dominant-baseline="middle">Loop Engineering</text>
    <text data-layout-role="card-body" class="c-body" x="680" y="1098" font-size="19" dominant-baseline="middle"><tspan x="680" dy="0">A goal and a stop condition, so</tspan><tspan x="680" dy="26">it runs and self-corrects.</tspan></text>
  </g>

  <!-- footer -->
  <rect x="48" y="1220" width="984" height="72" rx="14" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <text class="caption" x="540" y="1246" text-anchor="middle" dominant-baseline="central">A great prompt without context is a guess; without a harness it drifts;</text>
  <text class="caption" x="540" y="1272" text-anchor="middle" dominant-baseline="central">without a loop it waits for you.</text>
</svg>
