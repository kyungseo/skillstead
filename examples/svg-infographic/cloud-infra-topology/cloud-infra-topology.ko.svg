<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1020" width="720" height="1020" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Azure 레퍼런스 토폴로지</title>
  <desc>요청이 위에서 아래로 흐릅니다. 클라이언트 트래픽이 WAF를 얹은 Application Gateway로 들어와 API Management를 지나 AKS 클러스터에 닿고, 인그레스 컨트롤러가 ClusterIP Service와 레플리카 Pod 세 개로 넘깁니다. Pod는 프라이빗 엔드포인트로 Azure Database for PostgreSQL에 접근합니다. 클라이언트 뒤쪽은 모두 하나의 Azure VNet 안에 있습니다.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD;
      --vnet-fill:#F6F8FA; --vnet-line:#C6CFD9;
      --edge-fill:#E8F1FB; --edge-line:#1F6FB2; --edge-ink:#124267;
      --api-fill:#ECEBFB; --api-line:#534AB7; --api-ink:#3C3489;
      --k8s-fill:#E7F5EF; --k8s-line:#0F7A5F; --k8s-ink:#085041; --k8s-band:#F1F9F5;
      --data-fill:#F1F1EE; --data-line:#7A8398; --data-ink:#3F4453; }
    .eyebrow{ fill:var(--primary); font-size:14px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:28px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:14px }
    .frame{ font-size:14px; font-weight:700; letter-spacing:0.04em }
    .bt{ font-size:15px; font-weight:700 }
    .bs{ fill:var(--muted); font-size:11.5px }
    .legend{ fill:var(--muted); font-size:12px }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <marker id="ahD" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#7A8398" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.08"/>
    </filter>
    <symbol id="ic-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5a13 13 0 0 1 0 17 13 13 0 0 1 0-17z"/></symbol>
    <symbol id="ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="ic-api" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-4 7 4 7M15 5l4 7-4 7"/></symbol>
    <symbol id="ic-net" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V13M12 13l-5 4M12 13l5 4"/></symbol>
    <symbol id="ic-svc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></symbol>
    <symbol id="ic-pod" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.3 8-4.3"/><path d="M12 11.5V21"/></symbol>
    <symbol id="ic-db" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></symbol>
  </defs>

  <rect width="720" height="1020" fill="var(--bg)"/>

  <!-- header: rail from eyebrowTop(51) to titleBottom(106) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="36" y="35" width="5" height="71" rx="2.5" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="60" y="58" font-size="14" dominant-baseline="middle">레퍼런스 토폴로지</text>
    <text data-layout-role="title-line" class="h1" x="60" y="92" font-size="28" dominant-baseline="middle">Azure 레퍼런스 토폴로지</text>
    <text data-layout-role="title-subtitle" class="sub" x="60" y="130" font-size="14" dominant-baseline="middle">요청 경로 — Application Gateway → APIM → AKS → PostgreSQL</text>
  </g>

  <!-- client -->
  <rect x="210" y="168" width="300" height="46" rx="10" fill="var(--card)" stroke="var(--edge-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="242" cy="191" r="15" fill="var(--edge-fill)"/><use href="#ic-globe" x="233" y="182" width="18" height="18" style="color:#1F6FB2"/>
  <text class="bt" x="266" y="191" dominant-baseline="central" fill="var(--edge-ink)">인터넷 / 클라이언트</text>
  <path d="M360 222 V245" fill="none" stroke="var(--edge-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- VNet frame -->
  <rect x="36" y="254" width="648" height="640" rx="18" fill="var(--vnet-fill)" stroke="var(--vnet-line)" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="frame" x="60" y="276" dominant-baseline="central" fill="var(--muted)">Azure VNet</text>

  <!-- application gateway -->
  <rect x="68" y="296" width="584" height="54" rx="10" fill="var(--card)" stroke="var(--edge-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="100" cy="323" r="17" fill="var(--edge-fill)"/><use href="#ic-shield" x="90" y="313" width="20" height="20" style="color:#1F6FB2"/>
  <text class="bt" x="128" y="315" dominant-baseline="central" fill="var(--edge-ink)">Application Gateway + WAF</text>
  <text class="bs" x="128" y="335" dominant-baseline="central">공개 진입 · TLS 종료 · L7 라우팅</text>
  <path d="M360 358 V381" fill="none" stroke="var(--edge-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- api management -->
  <rect x="68" y="390" width="584" height="54" rx="10" fill="var(--card)" stroke="var(--api-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="100" cy="417" r="17" fill="var(--api-fill)"/><use href="#ic-api" x="90" y="407" width="20" height="20" style="color:#534AB7"/>
  <text class="bt" x="128" y="409" dominant-baseline="central" fill="var(--api-ink)">API Management (APIM)</text>
  <text class="bs" x="128" y="429" dominant-baseline="central">인증 · rate limit · 정책 · 버전 관리</text>
  <path d="M360 452 V475" fill="none" stroke="var(--edge-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- AKS cluster -->
  <rect x="68" y="484" width="584" height="288" rx="14" fill="var(--k8s-band)" stroke="var(--k8s-line)" stroke-width="1"/>
  <text class="frame" x="96" y="506" dominant-baseline="central" fill="var(--k8s-ink)">AKS 클러스터</text>

  <rect x="96" y="524" width="528" height="44" rx="9" fill="var(--card)" stroke="var(--k8s-line)" stroke-width="1"/>
  <circle cx="126" cy="546" r="14" fill="var(--k8s-fill)"/><use href="#ic-net" x="118" y="538" width="16" height="16" style="color:#0F7A5F"/>
  <text class="bt" x="152" y="546" dominant-baseline="central" fill="var(--k8s-ink)">인그레스 컨트롤러</text>
  <path d="M360 576 V599" fill="none" stroke="var(--k8s-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/>

  <rect x="96" y="608" width="528" height="44" rx="9" fill="var(--card)" stroke="var(--k8s-line)" stroke-width="1"/>
  <circle cx="126" cy="630" r="14" fill="var(--k8s-fill)"/><use href="#ic-svc" x="118" y="622" width="16" height="16" style="color:#0F7A5F"/>
  <text class="bt" x="152" y="630" dominant-baseline="central" fill="var(--k8s-ink)">Service (ClusterIP)</text>

  <!-- fan-out to replica pods -->
  <g fill="none" stroke="var(--k8s-line)" stroke-width="2" stroke-linecap="round">
    <path d="M360 660 V668"/>
    <path d="M180 668 H540"/>
    <path d="M180 668 V691" marker-end="url(#ah)"/>
    <path d="M360 668 V691" marker-end="url(#ah)"/>
    <path d="M540 668 V691" marker-end="url(#ah)"/>
  </g>

  <rect x="96" y="700" width="168" height="52" rx="9" fill="var(--card)" stroke="var(--k8s-line)" stroke-width="1"/>
  <text class="bt" x="180" y="718" text-anchor="middle" dominant-baseline="central" fill="var(--k8s-ink)">Pod</text>
  <text class="bs" x="180" y="737" text-anchor="middle" dominant-baseline="central">레플리카</text>
  <rect x="276" y="700" width="168" height="52" rx="9" fill="var(--card)" stroke="var(--k8s-line)" stroke-width="1"/>
  <text class="bt" x="360" y="718" text-anchor="middle" dominant-baseline="central" fill="var(--k8s-ink)">Pod</text>
  <text class="bs" x="360" y="737" text-anchor="middle" dominant-baseline="central">레플리카</text>
  <rect x="456" y="700" width="168" height="52" rx="9" fill="var(--card)" stroke="var(--k8s-line)" stroke-width="1"/>
  <text class="bt" x="540" y="718" text-anchor="middle" dominant-baseline="central" fill="var(--k8s-ink)">Pod</text>
  <text class="bs" x="540" y="737" text-anchor="middle" dominant-baseline="central">레플리카</text>

  <!-- private link to postgres -->
  <path d="M360 780 V803" fill="none" stroke="var(--data-line)" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#ahD)"/>

  <rect x="68" y="812" width="584" height="54" rx="10" fill="var(--card)" stroke="var(--data-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="100" cy="839" r="17" fill="var(--data-fill)"/><use href="#ic-db" x="90" y="829" width="20" height="20" style="color:#7A8398"/>
  <text class="bt" x="128" y="831" dominant-baseline="central" fill="var(--data-ink)">Azure Database for PostgreSQL</text>
  <text class="bs" x="128" y="851" dominant-baseline="central">Flexible Server · 프라이빗 엔드포인트</text>

  <!-- legend -->
  <rect x="36" y="922" width="648" height="50" rx="10" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <path d="M62 947 H98" fill="none" stroke="var(--edge-line)" stroke-width="2.2" stroke-linecap="round"/>
  <text class="legend" x="108" y="947" dominant-baseline="central">요청 경로 (동기)</text>
  <path d="M330 947 H366" fill="none" stroke="var(--data-line)" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text class="legend" x="376" y="947" dominant-baseline="central">프라이빗 링크 (관리형 서비스)</text>
</svg>
