<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>AI Code Review Loop</title>
  <desc>A five-stage code review flow: a pull request opens, an AI review agent reads the diff, a human reviewer triages what matters, the author patches and re-verifies, and the change becomes merge ready. A dashed feedback loop sends patched work back to the AI agent for another pass.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --band:#F4F8FC; --card:#FFFFFF; --strip:#F7FAFD;
      --step-fill:#E8F1FB; --step-line:#1F6FB2; --step-ink:#124267;
      --key-fill:#ECEBFB; --key-line:#534AB7; --key-ink:#3C3489; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:44px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:18px }
    .pill{ font-size:16px; font-weight:700; letter-spacing:0.06em }
    .tag{ font-size:11.5px; font-weight:700; letter-spacing:0.08em }
    .card-title{ font-size:20px; font-weight:700 }
    .card-sub{ fill:var(--muted); font-size:14px }
    .badge{ font-size:15px; font-weight:700 }
    .loop-label{ fill:var(--key-ink); font-size:14px; font-weight:650 }
    .legend{ fill:var(--muted); font-size:14px }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <marker id="ahLoop" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.10"/>
    </filter>
    <symbol id="ic-pr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.2"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="6" r="2.2"/><path d="M7 8.2v7.6"/><path d="M17 8.2v3.3a4 4 0 0 1-4 4H9.4"/></symbol>
    <symbol id="ic-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3l1.7 4.6L16.8 9l-4.6 1.7L10.5 15 8.8 10.7 4.2 9l4.6-1.4z"/><path d="M17.6 14.6l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
    <symbol id="ic-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="ic-retest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11a7.5 7.5 0 0 1 12.8-5.3L20 8"/><path d="M20 2.5V8h-5.5"/><path d="M8.5 15.5l2.4 2.4 4.6-4.8"/></symbol>
    <symbol id="ic-ready" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.4 2.4 4.6-4.8"/></symbol>
  </defs>

  <rect width="1600" height="720" fill="var(--bg)"/>

  <!-- header: rail from eyebrowTop(68) to titleBottom(142) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="52" y="52" width="6" height="90" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="80" y="76" font-size="16" dominant-baseline="middle">REVIEW FLOW</text>
    <text data-layout-role="title-line" class="h1" x="80" y="120" font-size="44" dominant-baseline="middle">AI Code Review Loop</text>
    <text data-layout-role="title-subtitle" class="sub" x="80" y="178" font-size="18" dominant-baseline="middle">From pull request to merge — AI review, human judgement, and re-review in one path</text>
  </g>

  <!-- band -->
  <rect x="52" y="220" width="1496" height="370" rx="20" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <rect x="84" y="201" width="196" height="38" rx="19" fill="var(--primary)"/>
  <text class="pill on-accent" x="182" y="220" text-anchor="middle" dominant-baseline="central">REVIEW PATH</text>

  <!-- stage 1 -->
  <g>
    <rect x="120" y="296" width="224" height="200" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="148" cy="324" r="15" fill="var(--step-line)"/><text class="badge on-accent" x="148" y="324" text-anchor="middle" dominant-baseline="central">1</text>
    <circle cx="232" cy="386" r="34" fill="var(--step-fill)"/><use href="#ic-pr" x="212" y="366" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="232" y="442" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">Open PR</text>
    <text class="card-sub" x="232" y="470" text-anchor="middle" dominant-baseline="central">the author opens it</text>
  </g>

  <!-- stage 2 — key step -->
  <g>
    <rect x="404" y="296" width="224" height="200" rx="16" fill="var(--card)" stroke="var(--key-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
    <circle cx="432" cy="324" r="15" fill="var(--key-line)"/><text class="badge on-accent" x="432" y="324" text-anchor="middle" dominant-baseline="central">2</text>
    <rect x="512" y="310" width="92" height="26" rx="13" fill="var(--key-fill)"/>
    <text class="tag" x="558" y="323" text-anchor="middle" dominant-baseline="central" fill="var(--key-ink)">KEY STEP</text>
    <circle cx="516" cy="386" r="34" fill="var(--key-fill)"/><use href="#ic-ai" x="496" y="366" width="40" height="40" style="color:#534AB7"/>
    <text class="card-title" x="516" y="442" text-anchor="middle" dominant-baseline="central" fill="var(--key-ink)">AI Review Agent</text>
    <text class="card-sub" x="516" y="470" text-anchor="middle" dominant-baseline="central">reads the whole diff</text>
  </g>

  <!-- stage 3 -->
  <g>
    <rect x="688" y="296" width="224" height="200" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="716" cy="324" r="15" fill="var(--step-line)"/><text class="badge on-accent" x="716" y="324" text-anchor="middle" dominant-baseline="central">3</text>
    <circle cx="800" cy="386" r="34" fill="var(--step-fill)"/><use href="#ic-person" x="780" y="366" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="800" y="442" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">Human Reviewer</text>
    <text class="card-sub" x="800" y="470" text-anchor="middle" dominant-baseline="central">decides what matters</text>
  </g>

  <!-- stage 4 -->
  <g>
    <rect x="972" y="296" width="224" height="200" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="1000" cy="324" r="15" fill="var(--step-line)"/><text class="badge on-accent" x="1000" y="324" text-anchor="middle" dominant-baseline="central">4</text>
    <circle cx="1084" cy="386" r="34" fill="var(--step-fill)"/><use href="#ic-retest" x="1064" y="366" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="1084" y="442" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">Patch and Verify</text>
    <text class="card-sub" x="1084" y="470" text-anchor="middle" dominant-baseline="central">fix, then run tests again</text>
  </g>

  <!-- stage 5 -->
  <g>
    <rect x="1256" y="296" width="224" height="200" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="1284" cy="324" r="15" fill="var(--step-line)"/><text class="badge on-accent" x="1284" y="324" text-anchor="middle" dominant-baseline="central">5</text>
    <circle cx="1368" cy="386" r="34" fill="var(--step-fill)"/><use href="#ic-ready" x="1348" y="366" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="1368" y="442" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">Merge Ready</text>
    <text class="card-sub" x="1368" y="470" text-anchor="middle" dominant-baseline="central">approved and merged</text>
  </g>

  <!-- normal path: corridor 60, shaft 2.5, visible head 7.5 (3.0x) -->
  <g fill="none" stroke="var(--step-line)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M354 386 H394"/>
    <path d="M638 386 H678"/>
    <path d="M922 386 H962"/>
    <path d="M1206 386 H1246"/>
  </g>

  <!-- feedback loop: patch and verify → AI review agent -->
  <path d="M1084 504 V548 H516 V514" fill="none" stroke="var(--key-line)" stroke-width="2.5"
    stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ahLoop)"/>
  <text class="loop-label" x="800" y="532" text-anchor="middle" dominant-baseline="central">re-review after the patch</text>

  <!-- legend -->
  <rect x="52" y="618" width="1496" height="48" rx="12" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <path d="M84 642 H124" fill="none" stroke="var(--step-line)" stroke-width="2.5" stroke-linecap="round"/>
  <text class="legend" x="136" y="642" dominant-baseline="central">Solid — the normal path</text>
  <path d="M420 642 H460" fill="none" stroke="var(--key-line)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  <text class="legend" x="472" y="642" dominant-baseline="central">Dashed — feedback loop back to review</text>
</svg>
