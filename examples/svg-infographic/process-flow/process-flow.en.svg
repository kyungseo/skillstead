<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>RAG Query Pipeline</title>
  <desc>A five-stage retrieval-augmented generation flow: a user query is embedded, matched against a vector store, merged with the retrieved context, and only then sent to the model — so the answer is grounded in retrieved facts rather than memory alone.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --band:#F4F8FC; --card:#FFFFFF; --strip:#F7FAFD;
      --step-fill:#E8F1FB; --step-line:#1F6FB2; --step-ink:#124267;
      --ok-fill:#E7F5EF; --ok-line:#0F7A5F; --ok-ink:#085041; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:42px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:18px }
    .pill-label{ font-size:16px; font-weight:700; letter-spacing:0.06em }
    .card-title{ font-size:21px; font-weight:700 }
    .card-sub{ fill:var(--muted); font-size:15px }
    .badge-num{ font-size:15px; font-weight:700 }
    .caption{ fill:var(--muted); font-size:17px }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.10"/>
    </filter>
    <symbol id="ic-query" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H10l-4 4v-4H5z"/><path d="M10.4 8.4a1.7 1.7 0 1 1 1.9 1.9v.9"/><path d="M12.3 12.7h.01"/></symbol>
    <symbol id="ic-embed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h7M4 12h7M4 18h5"/><path d="M13.5 12h5"/><path d="M16.5 9.5l2.5 2.5-2.5 2.5"/></symbol>
    <symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.5 4.5"/></symbol>
    <symbol id="ic-merge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h4c3 0 3 6 6 6h5"/><path d="M4 18h4c3 0 3-6 6-6"/><path d="M16.5 9.5l2.5 2.5-2.5 2.5"/></symbol>
    <symbol id="ic-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3l1.7 4.6L16.8 9l-4.6 1.7L10.5 15 8.8 10.7 4.2 9l4.6-1.4z"/><path d="M17.6 14.6l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
    <symbol id="ic-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 17.5h5"/><path d="M10.5 20.5h3"/><path d="M12 3a6 6 0 0 0-3.4 10.9c.4.3.6.7.6 1.1h5.6c0-.4.2-.8.6-1.1A6 6 0 0 0 12 3z"/></symbol>
  </defs>

  <rect width="1400" height="700" fill="var(--bg)"/>

  <!-- header: rail derived from eyebrowTop(64) and titleBottom(135) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="48" y="48" width="6" height="87" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="76" y="72" font-size="16" dominant-baseline="middle">PROCESS FLOW</text>
    <text data-layout-role="title-line" class="h1" x="76" y="114" font-size="42" dominant-baseline="middle">RAG Query Pipeline</text>
    <text data-layout-role="title-subtitle" class="sub" x="76" y="168" font-size="18" dominant-baseline="middle">Retrieval-augmented generation — retrieved context grounds the model before it answers</text>
  </g>

  <!-- band -->
  <rect x="48" y="212" width="1304" height="310" rx="20" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <rect x="80" y="193" width="200" height="38" rx="19" fill="var(--primary)"/>
  <text class="pill-label on-accent" x="180" y="212" text-anchor="middle" dominant-baseline="central">RAG PIPELINE</text>

  <!-- stage 1 -->
  <g>
    <rect x="108" y="262" width="192" height="210" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="136" cy="290" r="15" fill="var(--step-line)"/>
    <text class="badge-num on-accent" x="136" y="290" text-anchor="middle" dominant-baseline="central">1</text>
    <circle cx="204" cy="354" r="34" fill="var(--step-fill)"/>
    <use href="#ic-query" x="184" y="334" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="204" y="414" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">User Query</text>
    <text class="card-sub" x="204" y="444" text-anchor="middle" dominant-baseline="central">the question</text>
  </g>

  <!-- stage 2 -->
  <g>
    <rect x="356" y="262" width="192" height="210" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="384" cy="290" r="15" fill="var(--step-line)"/>
    <text class="badge-num on-accent" x="384" y="290" text-anchor="middle" dominant-baseline="central">2</text>
    <circle cx="452" cy="354" r="34" fill="var(--step-fill)"/>
    <use href="#ic-embed" x="432" y="334" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="452" y="414" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">Embed</text>
    <text class="card-sub" x="452" y="444" text-anchor="middle" dominant-baseline="central">text → vector</text>
  </g>

  <!-- stage 3 -->
  <g>
    <rect x="604" y="262" width="192" height="210" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="632" cy="290" r="15" fill="var(--step-line)"/>
    <text class="badge-num on-accent" x="632" y="290" text-anchor="middle" dominant-baseline="central">3</text>
    <circle cx="700" cy="354" r="34" fill="var(--step-fill)"/>
    <use href="#ic-search" x="680" y="334" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="700" y="414" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">Vector Search</text>
    <text class="card-sub" x="700" y="444" text-anchor="middle" dominant-baseline="central">top-k retrieve</text>
  </g>

  <!-- stage 4 -->
  <g>
    <rect x="852" y="262" width="192" height="210" rx="16" fill="var(--card)" stroke="var(--step-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="880" cy="290" r="15" fill="var(--step-line)"/>
    <text class="badge-num on-accent" x="880" y="290" text-anchor="middle" dominant-baseline="central">4</text>
    <circle cx="948" cy="354" r="34" fill="var(--step-fill)"/>
    <use href="#ic-merge" x="928" y="334" width="40" height="40" style="color:#1F6FB2"/>
    <text class="card-title" x="948" y="414" text-anchor="middle" dominant-baseline="central" fill="var(--step-ink)">Augment</text>
    <text class="card-sub" x="948" y="444" text-anchor="middle" dominant-baseline="central">query + context</text>
  </g>

  <!-- stage 5 — emphasized outcome -->
  <g>
    <rect x="1100" y="262" width="192" height="210" rx="16" fill="var(--card)" stroke="var(--ok-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
    <circle cx="1128" cy="290" r="15" fill="var(--ok-line)"/>
    <text class="badge-num on-accent" x="1128" y="290" text-anchor="middle" dominant-baseline="central">5</text>
    <circle cx="1196" cy="354" r="34" fill="var(--ok-fill)"/>
    <use href="#ic-spark" x="1176" y="334" width="40" height="40" style="color:#0F7A5F"/>
    <text class="card-title" x="1196" y="414" text-anchor="middle" dominant-baseline="central" fill="var(--ok-ink)">Generate</text>
    <text class="card-sub" x="1196" y="444" text-anchor="middle" dominant-baseline="central">LLM → answer</text>
  </g>

  <!-- connectors: corridor 56, shaft 2.5, visible head 7.5 (3.0x), tip gap 9 -->
  <g fill="none" stroke="var(--step-line)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M310 354 L346 354"/>
    <path d="M558 354 L594 354"/>
    <path d="M806 354 L842 354"/>
    <path d="M1054 354 L1090 354"/>
  </g>

  <!-- footer -->
  <rect x="48" y="562" width="1304" height="78" rx="14" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="88" cy="601" r="22" fill="#E3EEF8"/>
  <use href="#ic-bulb" x="74" y="587" width="28" height="28" style="color:#1F6FB2"/>
  <text class="caption" x="124" y="601" dominant-baseline="central">Retrieved top-k context is added to the prompt, so the model answers from grounded facts rather than memory alone.</text>
</svg>
