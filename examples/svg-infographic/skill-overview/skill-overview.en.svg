<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1120" width="1080" height="1120" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>svg-infographic — what the skill makes</title>
  <desc>An overview of the svg-infographic skill: the six diagram archetypes it draws, the four steps it runs (confirm, author the SVG, render, verify), first-class Korean and CJK typesetting, cross-platform rendering, and the work it deliberately does not take on.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD; --band:#F4F8FC;
      --b-fill:#E8F1FB; --b-line:#1F6FB2; --b-ink:#124267;
      --g-fill:#E7F5EF; --g-line:#0F7A5F; --g-ink:#085041;
      --n-fill:#F1F1EE; --n-line:#C3CBD4; --n-ink:#4A5563; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:36px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:16px }
    .sec{ fill:var(--ink); font-size:17px; font-weight:700 }
    .ct{ font-size:19px; font-weight:700 }
    .cs{ fill:var(--muted); font-size:13.5px }
    .badge{ font-size:14px; font-weight:700 }
    .ft{ font-size:18px; font-weight:700 }
    .sample{ fill:var(--ink); font-size:20px; font-weight:650 }
    .fs{ fill:var(--muted); font-size:13.5px }
    .no{ fill:var(--muted); font-size:14px }
    .tag{ fill:var(--muted); font-size:14px }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.09"/>
    </filter>
    <symbol id="ic-topo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V13M12 13l-5 4M12 13l5 4"/></symbol>
    <symbol id="ic-onion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><rect x="6.5" y="8" width="11" height="8" rx="2"/><rect x="10" y="10.8" width="4" height="2.4" rx="1"/></symbol>
    <symbol id="ic-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="6" height="6" rx="1.6"/><rect x="15.5" y="9" width="6" height="6" rx="1.6"/><path d="M9 12h4.4"/><path d="M11.8 10.2l1.8 1.8-1.8 1.8"/></symbol>
    <symbol id="ic-ba" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="8" height="14" rx="1.8"/><rect x="13.5" y="5" width="8" height="14" rx="1.8"/></symbol>
    <symbol id="ic-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="7" rx="1.6"/><rect x="13" y="4" width="8" height="7" rx="1.6"/><rect x="3" y="13" width="8" height="7" rx="1.6"/><rect x="13" y="13" width="8" height="7" rx="1.6"/></symbol>
    <symbol id="ic-road" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><circle cx="6.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="17.5" cy="12" r="2"/></symbol>
    <symbol id="ic-lang" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5a13 13 0 0 1 0 17 13 13 0 0 1 0-17z"/></symbol>
    <symbol id="ic-plat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 17v3"/></symbol>
  </defs>

  <rect width="1080" height="1120" fill="var(--bg)"/>

  <!-- header: rail from eyebrowTop(60) to titleBottom(122) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="44" y="44" width="6" height="78" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="72" y="68" font-size="16" dominant-baseline="middle">AGENT SKILL</text>
    <text data-layout-role="title-line" class="h1" x="72" y="104" font-size="36" dominant-baseline="middle">svg-infographic</text>
    <text data-layout-role="title-subtitle" class="sub" x="72" y="150" font-size="16" dominant-baseline="middle">Describe it, and get a clean technical diagram plus a PNG you can share.</text>
  </g>

  <text class="sec" x="44" y="192" dominant-baseline="central">Diagrams it draws</text>

  <rect x="44" y="212" width="484" height="92" rx="14" fill="var(--card)" stroke="var(--hair)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="94" cy="258" r="24" fill="var(--b-fill)"/><use href="#ic-topo" x="80" y="244" width="28" height="28" style="color:#1F6FB2"/>
  <text class="ct" x="136" y="246" dominant-baseline="central" fill="var(--b-ink)">Topology</text>
  <text class="cs" x="136" y="272" dominant-baseline="central">zones, nodes, request paths</text>

  <rect x="552" y="212" width="484" height="92" rx="14" fill="var(--card)" stroke="var(--hair)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="602" cy="258" r="24" fill="var(--b-fill)"/><use href="#ic-onion" x="588" y="244" width="28" height="28" style="color:#1F6FB2"/>
  <text class="ct" x="644" y="246" dominant-baseline="central" fill="var(--b-ink)">Layer / onion</text>
  <text class="cs" x="644" y="272" dominant-baseline="central">nested containment models</text>

  <rect x="44" y="324" width="484" height="92" rx="14" fill="var(--card)" stroke="var(--hair)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="94" cy="370" r="24" fill="var(--b-fill)"/><use href="#ic-flow" x="80" y="356" width="28" height="28" style="color:#1F6FB2"/>
  <text class="ct" x="136" y="358" dominant-baseline="central" fill="var(--b-ink)">Flow</text>
  <text class="cs" x="136" y="384" dominant-baseline="central">process and data pipelines</text>

  <rect x="552" y="324" width="484" height="92" rx="14" fill="var(--card)" stroke="var(--hair)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="602" cy="370" r="24" fill="var(--b-fill)"/><use href="#ic-ba" x="588" y="356" width="28" height="28" style="color:#1F6FB2"/>
  <text class="ct" x="644" y="358" dominant-baseline="central" fill="var(--b-ink)">Before / after</text>
  <text class="cs" x="644" y="384" dominant-baseline="central">two panels you can diff</text>

  <rect x="44" y="436" width="484" height="92" rx="14" fill="var(--card)" stroke="var(--hair)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="94" cy="482" r="24" fill="var(--b-fill)"/><use href="#ic-cards" x="80" y="468" width="28" height="28" style="color:#1F6FB2"/>
  <text class="ct" x="136" y="470" dominant-baseline="central" fill="var(--b-ink)">Cards</text>
  <text class="cs" x="136" y="496" dominant-baseline="central">icon, title, one-line text</text>

  <rect x="552" y="436" width="484" height="92" rx="14" fill="var(--card)" stroke="var(--hair)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="602" cy="482" r="24" fill="var(--b-fill)"/><use href="#ic-road" x="588" y="468" width="28" height="28" style="color:#1F6FB2"/>
  <text class="ct" x="644" y="470" dominant-baseline="central" fill="var(--b-ink)">Roadmap</text>
  <text class="cs" x="644" y="496" dominant-baseline="central">phases and milestones</text>

  <text class="sec" x="44" y="568" dominant-baseline="central">How it works</text>

  <rect x="44" y="588" width="212" height="112" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="72" cy="616" r="15" fill="var(--b-line)"/><text class="badge on-accent" x="72" y="616" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="ct" x="150" y="654" text-anchor="middle" dominant-baseline="central" fill="var(--b-ink)">Confirm</text>
  <text class="cs" x="150" y="678" text-anchor="middle" dominant-baseline="central">intent · ratio · language</text>

  <rect x="304" y="588" width="212" height="112" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="332" cy="616" r="15" fill="var(--b-line)"/><text class="badge on-accent" x="332" y="616" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="ct" x="410" y="654" text-anchor="middle" dominant-baseline="central" fill="var(--b-ink)">Author SVG</text>
  <text class="cs" x="410" y="678" text-anchor="middle" dominant-baseline="central">tokens · CJK font stack</text>

  <rect x="564" y="588" width="212" height="112" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="592" cy="616" r="15" fill="var(--b-line)"/><text class="badge on-accent" x="592" y="616" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="ct" x="670" y="654" text-anchor="middle" dominant-baseline="central" fill="var(--b-ink)">Render</text>
  <text class="cs" x="670" y="678" text-anchor="middle" dominant-baseline="central">headless → 2× PNG</text>

  <rect x="824" y="588" width="212" height="112" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="852" cy="616" r="15" fill="var(--g-line)"/><text class="badge on-accent" x="852" y="616" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="ct" x="930" y="654" text-anchor="middle" dominant-baseline="central" fill="var(--g-ink)">Verify</text>
  <text class="cs" x="930" y="678" text-anchor="middle" dominant-baseline="central">no overflow · no tofu</text>

  <g fill="none" stroke="var(--b-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M264 644 H295"/>
    <path d="M524 644 H555"/>
    <path d="M784 644 H815"/>
  </g>

  <!-- feature bands -->
  <rect x="44" y="736" width="484" height="130" rx="16" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="88" cy="778" r="22" fill="var(--b-fill)"/><use href="#ic-lang" x="75" y="765" width="26" height="26" style="color:#1F6FB2"/>
  <text class="ft" x="124" y="778" dominant-baseline="central" fill="var(--b-ink)">Korean and CJK first</text>
  <text class="sample" x="72" y="820" dominant-baseline="central">가나다라 · ABCabc · 0123</text>
  <text class="fs" x="72" y="846" dominant-baseline="central">rendered and checked — no tofu glyphs</text>

  <rect x="552" y="736" width="484" height="130" rx="16" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="596" cy="778" r="22" fill="var(--b-fill)"/><use href="#ic-plat" x="583" y="765" width="26" height="26" style="color:#1F6FB2"/>
  <text class="ft" x="632" y="778" dominant-baseline="central" fill="var(--b-ink)">Runs anywhere you work</text>
  <text class="sample" x="580" y="820" dominant-baseline="central">macOS · Windows · Linux</text>
  <text class="fs" x="580" y="846" dominant-baseline="central">any Chromium browser — Chrome, Edge, Chromium</text>

  <!-- not for -->
  <rect x="44" y="894" width="992" height="60" rx="12" fill="var(--n-fill)" stroke="var(--n-line)" stroke-width="1"/>
  <text class="no" x="72" y="924" dominant-baseline="central"><tspan font-weight="700" fill="#4A5563">Not for</tspan> — photo and illustration work · data-accurate charts · mascots and character art</text>

  <!-- tagline -->
  <text class="tag" x="44" y="1006" dominant-baseline="central">A portable agent skill · flat, structural technical infographics — SVG source plus a 2× PNG.</text>
</svg>
