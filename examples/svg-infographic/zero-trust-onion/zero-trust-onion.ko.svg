<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Zero Trust — 신뢰는 상속되지 않는다</title>
  <desc>zero-trust를 네 겹으로 정리했습니다. 네트워크 경계에 닿았다는 사실은 아무 권한도 주지 않고, Identity &amp; Access가 요청마다 인증하며, 디바이스와 워크로드는 상태를 상시 점검합니다. 데이터 코어는 기본값이 최소 권한입니다. 각 계층은 바깥 계층을 믿는 대신 스스로 검증합니다.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --strip:#F7FAFD;
      --r1-fill:#EEF3F8; --r1-line:#CBD9E7; --r1-ink:#42586E;
      --r2-fill:#DCE8F4; --r2-line:#AAC6E0; --r2-ink:#2C5478;
      --r3-fill:#BFD7EC; --r3-line:#8DB4D6; --r3-ink:#1D4468;
      --r4-fill:#1B4A72; --r4-line:#12385A; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:42px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:18px }
    .ring{ font-size:20px; font-weight:650 }
    .core{ font-size:26px; font-weight:700 }
    .core-sub{ font-size:16px }
    .rule{ font-size:16px; font-weight:600 }
  </style>

  <defs>
    <symbol id="ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  </defs>

  <rect width="1400" height="900" fill="var(--bg)"/>

  <!-- header: computed title-keyline from the H1 line box (42px + 11px pad per side) -->
  <g data-layout-role="header-cluster" data-layout-tolerance="2">
    <rect data-layout-role="cluster-keyline" x="52" y="86" width="6" height="64" rx="3" fill="var(--primary)"/>
    <text data-layout-role="cluster-eyebrow" class="eyebrow" x="76" y="72" font-size="16" dominant-baseline="central">접근 모델</text>
    <text data-layout-role="cluster-h1" class="h1" x="76" y="118" font-size="42" dominant-baseline="central">Zero Trust — 신뢰는 상속되지 않는다</text>
    <text data-layout-role="cluster-subtitle" class="sub" x="76" y="176" font-size="18" dominant-baseline="central">계층마다 요청 단위로 신뢰를 다시 세운다 — 네트워크에 닿았다는 건 아무것도 증명하지 않는다</text>
  </g>

  <!-- nested rings: uniform 60px inset -->
  <rect x="290" y="230" width="820" height="530" rx="30" fill="var(--r1-fill)" stroke="var(--r1-line)" stroke-width="1"/>
  <text class="ring" x="700" y="260" text-anchor="middle" dominant-baseline="central" fill="var(--r1-ink)">네트워크 경계 — 도달해도 아무 권한이 생기지 않는다</text>

  <rect x="350" y="290" width="700" height="410" rx="26" fill="var(--r2-fill)" stroke="var(--r2-line)" stroke-width="1"/>
  <text class="ring" x="700" y="320" text-anchor="middle" dominant-baseline="central" fill="var(--r2-ink)">Identity &amp; Access — 요청마다 인증한다</text>

  <rect x="410" y="350" width="580" height="290" rx="22" fill="var(--r3-fill)" stroke="var(--r3-line)" stroke-width="1"/>
  <text class="ring" x="700" y="380" text-anchor="middle" dominant-baseline="central" fill="var(--r3-ink)">디바이스 &amp; 워크로드 — 상태를 상시 점검한다</text>

  <rect x="470" y="410" width="460" height="170" rx="18" fill="var(--r4-fill)" stroke="var(--r4-line)" stroke-width="1"/>
  <circle cx="700" cy="462" r="32" fill="#FFFFFF" fill-opacity="0.16"/>
  <use href="#ic-shield" x="682" y="444" width="36" height="36" style="color:#FFFFFF"/>
  <text class="core on-accent" x="700" y="516" text-anchor="middle" dominant-baseline="central">데이터 코어</text>
  <text class="core-sub on-accent" x="700" y="546" text-anchor="middle" dominant-baseline="central" opacity="0.88">기본값은 최소 권한</text>

  <!-- rule of thumb -->
  <rect x="48" y="792" width="1304" height="56" rx="12" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <text class="rule" x="700" y="820" text-anchor="middle" dominant-baseline="central" fill="var(--muted)">명시적으로 검증한다  ·  침해를 전제한다  ·  최소 권한만 준다</text>
</svg>
