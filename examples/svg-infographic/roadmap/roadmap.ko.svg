<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>제품 로드맵</title>
  <desc>가로 타임라인 위의 4단계 제품 로드맵입니다. 발견은 완료됐고 알파가 현재 단계이며 베타가 다음, 정식출시가 그 뒤입니다. 단계마다 상태 pill과 마일스톤 세 개를 답니다. 정확한 날짜 대신 단계로 관리합니다.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD;
      --done-line:#A9B3BF; --done-ink:#4A5563; --done-fill:#7A8398;
      --now-line:#1F6FB2; --now-ink:#124267;
      --soon-line:#C9DCEE; --soon-ink:#23527C; --soon-fill:#E8F1FB;
      --late-line:#DDE3EA; --late-ink:#5B6675; --late-fill:#F1F3F6; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:15px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:38px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:17px }
    .phase{ font-size:21px; font-weight:700 }
    .pill{ font-size:13px; font-weight:700; letter-spacing:0.04em }
    .bullet{ fill:var(--muted); font-size:15.5px }
    .legend{ fill:var(--muted); font-size:14px }
  </style>

  <defs>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1240" height="620" fill="var(--bg)"/>

  <!-- header: rail from eyebrowTop(60) to titleBottom(129) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="44" y="44" width="6" height="85" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="72" y="68" font-size="16" dominant-baseline="middle">로드맵</text>
    <text data-layout-role="title-line" class="h1" x="72" y="110" font-size="38" dominant-baseline="middle">제품 로드맵</text>
    <text data-layout-role="title-subtitle" class="sub" x="72" y="158" font-size="17" dominant-baseline="middle">정확한 날짜보다 단계 중심 · 발견 → 정식출시</text>
  </g>

  <!-- NOW marker: sits in the gutter between Alpha and Beta -->
  <rect x="590" y="182" width="60" height="26" rx="13" fill="var(--primary)"/>
  <text class="pill on-accent" x="620" y="195" text-anchor="middle" dominant-baseline="central">현재</text>
  <path d="M620 208 V494" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- axis -->
  <path d="M60 250 H1180" fill="none" stroke="var(--hair)" stroke-width="3" stroke-linecap="round"/>
  <text class="phase" x="191" y="214" text-anchor="middle" dominant-baseline="central" fill="var(--done-ink)">발견</text>
  <text class="phase" x="477" y="214" text-anchor="middle" dominant-baseline="central" fill="var(--now-ink)">알파</text>
  <text class="phase" x="763" y="214" text-anchor="middle" dominant-baseline="central" fill="var(--soon-ink)">베타</text>
  <text class="phase" x="1049" y="214" text-anchor="middle" dominant-baseline="central" fill="var(--late-ink)">정식출시</text>
  <circle cx="191" cy="250" r="9" fill="var(--done-fill)"/>
  <circle cx="477" cy="250" r="12" fill="var(--primary)" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="763" cy="250" r="9" fill="#FFFFFF" stroke="var(--soon-line)" stroke-width="2.5"/>
  <circle cx="1049" cy="250" r="9" fill="#FFFFFF" stroke="var(--late-line)" stroke-width="2.5"/>

  <line x1="191" y1="261" x2="191" y2="288" stroke="var(--done-line)" stroke-width="1.5"/>
  <line x1="477" y1="266" x2="477" y2="288" stroke="var(--now-line)" stroke-width="1.5"/>
  <line x1="763" y1="261" x2="763" y2="288" stroke="var(--soon-line)" stroke-width="1.5"/>
  <line x1="1049" y1="261" x2="1049" y2="288" stroke="var(--late-line)" stroke-width="1.5"/>

  <!-- phase 1 — done -->
  <g>
    <rect x="63" y="290" width="256" height="196" rx="16" fill="var(--card)" stroke="var(--done-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="85" y="318" width="78" height="28" rx="14" fill="var(--done-fill)"/>
    <text class="pill on-accent" x="124" y="332" text-anchor="middle" dominant-baseline="central">완료</text>
    <circle cx="90" cy="394" r="3" fill="var(--done-line)"/><text class="bullet" x="104" y="394" dominant-baseline="central">문제 검증</text>
    <circle cx="90" cy="426" r="3" fill="var(--done-line)"/><text class="bullet" x="104" y="426" dominant-baseline="central">범위·비목표 설정</text>
    <circle cx="90" cy="458" r="3" fill="var(--done-line)"/><text class="bullet" x="104" y="458" dominant-baseline="central">Go 결정</text>
  </g>

  <!-- phase 2 — current, emphasized -->
  <g>
    <rect x="349" y="290" width="256" height="196" rx="16" fill="var(--card)" stroke="var(--now-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
    <rect x="371" y="318" width="78" height="28" rx="14" fill="var(--primary)"/>
    <text class="pill on-accent" x="410" y="332" text-anchor="middle" dominant-baseline="central">현재</text>
    <circle cx="376" cy="394" r="3" fill="var(--now-line)"/><text class="bullet" x="390" y="394" dominant-baseline="central">코어 MVP 구축</text>
    <circle cx="376" cy="426" r="3" fill="var(--now-line)"/><text class="bullet" x="390" y="426" dominant-baseline="central">내부 테스트</text>
    <circle cx="376" cy="458" r="3" fill="var(--now-line)"/><text class="bullet" x="390" y="458" dominant-baseline="central">첫 예제</text>
  </g>

  <!-- phase 3 — next -->
  <g>
    <rect x="635" y="290" width="256" height="196" rx="16" fill="var(--card)" stroke="var(--soon-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="657" y="318" width="78" height="28" rx="14" fill="var(--soon-fill)"/>
    <text class="pill" x="696" y="332" text-anchor="middle" dominant-baseline="central" fill="var(--soon-ink)">다음</text>
    <circle cx="662" cy="394" r="3" fill="var(--soon-line)"/><text class="bullet" x="676" y="394" dominant-baseline="central">공개 프리뷰</text>
    <circle cx="662" cy="426" r="3" fill="var(--soon-line)"/><text class="bullet" x="676" y="426" dominant-baseline="central">피드백 루프</text>
    <circle cx="662" cy="458" r="3" fill="var(--soon-line)"/><text class="bullet" x="676" y="458" dominant-baseline="central">안정화</text>
  </g>

  <!-- phase 4 — later -->
  <g>
    <rect x="921" y="290" width="256" height="196" rx="16" fill="var(--card)" stroke="var(--late-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="943" y="318" width="78" height="28" rx="14" fill="var(--late-fill)"/>
    <text class="pill" x="982" y="332" text-anchor="middle" dominant-baseline="central" fill="var(--late-ink)">이후</text>
    <circle cx="948" cy="394" r="3" fill="var(--late-line)"/><text class="bullet" x="962" y="394" dominant-baseline="central">정식 릴리스</text>
    <circle cx="948" cy="426" r="3" fill="var(--late-line)"/><text class="bullet" x="962" y="426" dominant-baseline="central">전체 문서</text>
    <circle cx="948" cy="458" r="3" fill="var(--late-line)"/><text class="bullet" x="962" y="458" dominant-baseline="central">배포</text>
  </g>

  <line x1="85" y1="366" x2="297" y2="366" stroke="var(--done-line)" stroke-opacity="0.6" stroke-width="1"/>
  <line x1="371" y1="366" x2="583" y2="366" stroke="var(--now-line)" stroke-opacity="0.6" stroke-width="1"/>
  <line x1="657" y1="366" x2="869" y2="366" stroke="var(--soon-line)" stroke-opacity="0.6" stroke-width="1"/>
  <line x1="943" y1="366" x2="1155" y2="366" stroke="var(--late-line)" stroke-opacity="0.6" stroke-width="1"/>

  <!-- legend -->
  <rect x="44" y="512" width="1152" height="60" rx="12" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <circle cx="80" cy="542" r="7" fill="var(--done-fill)"/>
  <text class="legend" x="98" y="542" dominant-baseline="central">채운 원 — 완료했거나 진행 중</text>
  <circle cx="390" cy="542" r="7" fill="#FFFFFF" stroke="var(--soon-line)" stroke-width="2.5"/>
  <text class="legend" x="408" y="542" dominant-baseline="central">빈 원 — 아직 남은 단계</text>
  <path d="M660 532 V552" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="legend" x="678" y="542" dominant-baseline="central">점선 — 오늘 작업이 서 있는 지점</text>
</svg>
