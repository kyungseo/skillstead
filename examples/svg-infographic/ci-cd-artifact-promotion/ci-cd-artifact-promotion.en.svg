<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 772" width="960" height="772" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Release Candidate Artifact Promotion</title>
  <desc>Build once, promote the same digest. A single CI build produces RC-01 at image@sha256:aaa111, and dev, test, and prod all deploy that exact digest behind an approval gate, so test and prod are provably identical. A bug found in test retires RC-01 and a fix produces a new RC-02 at a different digest.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD; --band:#F4F8FC;
      --b-fill:#E8F1FB; --b-line:#1F6FB2; --b-ink:#124267;
      --g-fill:#E7F5EF; --g-line:#0F7A5F; --g-ink:#085041;
      --a-fill:#FDF3E3; --a-line:#D9A441; --a-ink:#8A5D14;
      --r-fill:#FBEDEC; --r-line:#C0544A; --r-ink:#8A322A; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:32px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:15.5px }
    .pill{ font-size:14px; font-weight:700; letter-spacing:0.06em }
    .nt{ font-size:16px; font-weight:700 }
    .ns{ fill:var(--muted); font-size:11.5px }
    .gate{ font-size:13px; font-weight:700 }
    .rule{ font-size:13px }
    .rule b{ font-weight:700 }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.09"/>
    </filter>
    <symbol id="ic-src" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.2"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="6" r="2.2"/><path d="M7 8.2v7.6"/><path d="M17 8.2v3.3a4 4 0 0 1-4 4H9.4"/></symbol>
    <symbol id="ic-build" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></symbol>
    <symbol id="ic-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.3 8-4.3"/><path d="M12 11.5V21"/></symbol>
    <symbol id="ic-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></symbol>
    <symbol id="ic-bug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v17"/><path d="M4.5 20.5l15-15"/><circle cx="12" cy="12" r="8.5"/></symbol>
    <symbol id="ic-fix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11a7.5 7.5 0 0 1 12.8-5.3L20 8"/><path d="M20 2.5V8h-5.5"/><path d="M8.5 15.5l2.4 2.4 4.6-4.8"/></symbol>
  </defs>

  <rect width="960" height="772" fill="var(--bg)"/>

  <!-- header: rail from eyebrowTop(56) to titleBottom(116) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="40" y="40" width="6" height="76" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="68" y="64" font-size="16" dominant-baseline="middle">RELEASE PIPELINE</text>
    <text data-layout-role="title-line" class="h1" x="68" y="100" font-size="32" dominant-baseline="middle">Release Candidate Artifact Promotion</text>
    <text data-layout-role="title-subtitle" class="sub" x="68" y="144" font-size="15.5" dominant-baseline="middle">Build once, promote the same digest — the unit you track is the artifact, not the branch</text>
  </g>

  <!-- band 1 — BUILD -->
  <rect x="40" y="180" width="880" height="138" rx="16" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <rect x="68" y="161" width="120" height="38" rx="19" fill="var(--primary)"/>
  <text class="pill on-accent" x="128" y="180" text-anchor="middle" dominant-baseline="central">① BUILD</text>

  <rect x="84" y="222" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="124" cy="260" r="20" fill="var(--b-fill)"/><use href="#ic-src" x="112" y="248" width="24" height="24" style="color:#1F6FB2"/>
  <text class="nt" x="156" y="250" dominant-baseline="central" fill="var(--b-ink)">Source</text>
  <text class="ns" x="156" y="272" dominant-baseline="central">develop → release/*</text>

  <rect x="368" y="222" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="408" cy="260" r="20" fill="var(--b-fill)"/><use href="#ic-build" x="396" y="248" width="24" height="24" style="color:#1F6FB2"/>
  <text class="nt" x="440" y="250" dominant-baseline="central" fill="var(--b-ink)">CI build</text>
  <text class="ns" x="440" y="272" dominant-baseline="central">runs exactly once</text>

  <rect x="652" y="222" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--g-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
  <circle cx="692" cy="260" r="20" fill="var(--g-fill)"/><use href="#ic-box" x="680" y="248" width="24" height="24" style="color:#0F7A5F"/>
  <text class="nt" x="724" y="250" dominant-baseline="central" fill="var(--g-ink)">RC-01 artifact</text>
  <text class="ns" x="724" y="272" dominant-baseline="central">@sha256:aaa111…</text>

  <g fill="none" stroke="var(--b-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M316 260 H356"/>
    <path d="M600 260 H640"/>
  </g>

  <!-- band 2 — PROMOTE -->
  <rect x="40" y="340" width="880" height="138" rx="16" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <rect x="68" y="321" width="140" height="38" rx="19" fill="var(--primary)"/>
  <text class="pill on-accent" x="138" y="340" text-anchor="middle" dominant-baseline="central">② PROMOTE</text>

  <rect x="562" y="346" width="120" height="28" rx="14" fill="var(--a-fill)" stroke="var(--a-line)" stroke-width="1"/>
  <text class="gate" x="622" y="360" text-anchor="middle" dominant-baseline="central" fill="var(--a-ink)">approval gate</text>
  <path d="M622 374 V412" fill="none" stroke="var(--a-line)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="84" y="382" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="124" cy="420" r="20" fill="var(--b-fill)"/><use href="#ic-server" x="112" y="408" width="24" height="24" style="color:#1F6FB2"/>
  <text class="nt" x="156" y="410" dominant-baseline="central" fill="var(--b-ink)">dev</text>
  <text class="ns" x="156" y="432" dominant-baseline="central">@aaa111</text>

  <rect x="368" y="382" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="408" cy="420" r="20" fill="var(--b-fill)"/><use href="#ic-server" x="396" y="408" width="24" height="24" style="color:#1F6FB2"/>
  <text class="nt" x="440" y="410" dominant-baseline="central" fill="var(--b-ink)">test</text>
  <text class="ns" x="440" y="432" dominant-baseline="central">@aaa111</text>

  <rect x="652" y="382" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--g-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
  <circle cx="692" cy="420" r="20" fill="var(--g-fill)"/><use href="#ic-server" x="680" y="408" width="24" height="24" style="color:#0F7A5F"/>
  <text class="nt" x="724" y="410" dominant-baseline="central" fill="var(--g-ink)">prod</text>
  <text class="ns" x="724" y="432" dominant-baseline="central">same digest as test</text>

  <g fill="none" stroke="var(--b-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M316 420 H356"/>
    <path d="M600 420 H640"/>
  </g>

  <!-- band 3 — RELEASE FIX -->
  <rect x="40" y="500" width="880" height="138" rx="16" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <rect x="68" y="481" width="176" height="38" rx="19" fill="var(--r-line)"/>
  <text class="pill on-accent" x="156" y="500" text-anchor="middle" dominant-baseline="central">③ RELEASE FIX</text>

  <rect x="84" y="542" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--r-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="124" cy="580" r="20" fill="var(--r-fill)"/><use href="#ic-bug" x="112" y="568" width="24" height="24" style="color:#C0544A"/>
  <text class="nt" x="156" y="570" dominant-baseline="central" fill="var(--r-ink)">Bug in test</text>
  <text class="ns" x="156" y="592" dominant-baseline="central">RC-01 is dropped</text>

  <rect x="368" y="542" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="408" cy="580" r="20" fill="var(--b-fill)"/><use href="#ic-fix" x="396" y="568" width="24" height="24" style="color:#1F6FB2"/>
  <text class="nt" x="440" y="570" dominant-baseline="central" fill="var(--b-ink)">Fix and rebuild</text>
  <text class="ns" x="440" y="592" dominant-baseline="central">release/* fix</text>

  <rect x="652" y="542" width="224" height="76" rx="12" fill="var(--card)" stroke="var(--g-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
  <circle cx="692" cy="580" r="20" fill="var(--g-fill)"/><use href="#ic-box" x="680" y="568" width="24" height="24" style="color:#0F7A5F"/>
  <text class="nt" x="724" y="570" dominant-baseline="central" fill="var(--g-ink)">New RC-02</text>
  <text class="ns" x="724" y="592" dominant-baseline="central">@sha256:bbb222…</text>

  <g fill="none" stroke="var(--b-line)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M316 580 H356"/>
    <path d="M600 580 H640"/>
  </g>

  <!-- footer rules -->
  <rect x="40" y="662" width="880" height="60" rx="12" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <text class="rule" x="68" y="692" dominant-baseline="central" fill="var(--muted)"><tspan font-weight="700" fill="#1F2733">Deploy by digest</tspan>, never by tag</text>
  <text class="rule" x="352" y="692" dominant-baseline="central" fill="var(--muted)"><tspan font-weight="700" fill="#1F2733">Rollback</tspan> = redeploy an approved digest</text>
  <text class="rule" x="672" y="692" dominant-baseline="central" fill="var(--muted)"><tspan font-weight="700" fill="#1F2733">Tag</tspan> after prod succeeds</text>
</svg>
