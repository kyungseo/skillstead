<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>대기 알림이 agent 유휴 시간을 없앤다</title>
  <desc>두 lane을 같은 column에 맞춰 놓았습니다. AGENT 상태 lane은 작업 중·승인 대기·작업 재개·완료로 흐르고, 사용자 lane은 다른 일에 몰입·원클릭 승인·몰입 유지·결과 리뷰로 흐릅니다. 승인 대기 column에서 알림이 아래로, 원클릭 승인이 위로 오가기 때문에 멈춤이 유휴 시간이 되지 않습니다.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD;
      --lane-a:#F4F8FC; --lane-b:#F6F7F9;
      --b-fill:#E8F1FB; --b-line:#1F6FB2; --b-ink:#124267;
      --a-fill:#FDF3E3; --a-line:#D9A441; --a-ink:#8A5D14;
      --n-fill:#EEF1F4; --n-line:#B9C2CC; --n-ink:#435060; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:42px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:18px }
    .lane{ font-size:15px; font-weight:700; letter-spacing:0.08em }
    .ct{ font-size:20px; font-weight:700 }
    .cs{ fill:var(--muted); font-size:13.5px }
    .badge{ font-size:14px; font-weight:700 }
    .xlabel{ font-size:13.5px; font-weight:650 }
    .legend{ fill:var(--muted); font-size:14px }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <marker id="ahX" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#D9A441" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.09"/>
    </filter>
    <symbol id="ic-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3L5.6 5.6"/></symbol>
    <symbol id="ic-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.4 19.5a2.2 2.2 0 0 0 3.2 0"/></symbol>
    <symbol id="ic-resume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.6l5 3.4-5 3.4z"/></symbol>
    <symbol id="ic-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.4 2.4 4.6-4.8"/></symbol>
    <symbol id="ic-focus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="ic-click" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5v3.6M4.5 9h3.6M6.1 6.1l2.5 2.5"/><path d="M11.5 11l8.5 3.2-3.7 1.4-1.4 3.7z"/></symbol>
    <symbol id="ic-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h5.2"/><circle cx="12" cy="12" r="2.4"/><path d="M15.3 12h5.2"/><path d="M17.8 9.2l2.8 2.8-2.8 2.8"/></symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 16.5h6M9 9.5h2"/></symbol>
  </defs>

  <rect width="1400" height="820" fill="var(--bg)"/>

  <!-- header: rail from eyebrowTop(64) to titleBottom(139) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="48" y="48" width="6" height="91" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="76" y="72" font-size="16" dominant-baseline="middle">세션 흐름</text>
    <text data-layout-role="title-line" class="h1" x="76" y="118" font-size="42" dominant-baseline="middle">대기 알림이 agent 유휴 시간을 없앤다</text>
    <text data-layout-role="title-subtitle" class="sub" x="76" y="176" font-size="18" dominant-baseline="middle">agent 상태와 사용자의 행동을 나란히 — 승인 때문에 실행이 멈추지 않는다</text>
  </g>

  <!-- lane A -->
  <rect x="48" y="226" width="1304" height="170" rx="16" fill="var(--lane-a)" stroke="var(--hair)" stroke-width="1"/>
  <text class="lane" x="76" y="311" dominant-baseline="central" fill="var(--b-ink)">AGENT 상태</text>

  <g>
    <rect x="206" y="256" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="232" cy="282" r="14" fill="var(--b-line)"/><text class="badge on-accent" x="232" y="282" text-anchor="middle" dominant-baseline="central">1</text>
    <circle cx="331" cy="286" r="20" fill="var(--b-fill)"/><use href="#ic-gear" x="319" y="274" width="24" height="24" style="color:#1F6FB2"/>
    <text class="ct" x="331" y="318" text-anchor="middle" dominant-baseline="central" fill="var(--b-ink)">작업 중</text>
    <text class="cs" x="331" y="344" text-anchor="middle" dominant-baseline="central">코드를 쓰고 도구를 돌린다</text>
  </g>
  <g>
    <rect x="500" y="256" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--a-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
    <circle cx="526" cy="282" r="14" fill="var(--a-line)"/><text class="badge on-accent" x="526" y="282" text-anchor="middle" dominant-baseline="central">2</text>
    <circle cx="625" cy="286" r="20" fill="var(--a-fill)"/><use href="#ic-bell" x="613" y="274" width="24" height="24" style="color:#D9A441"/>
    <text class="ct" x="625" y="318" text-anchor="middle" dominant-baseline="central" fill="var(--a-ink)">승인 대기</text>
    <text class="cs" x="625" y="344" text-anchor="middle" dominant-baseline="central">사용자 승인이 필요하다</text>
  </g>
  <g>
    <rect x="794" y="256" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="820" cy="282" r="14" fill="var(--b-line)"/><text class="badge on-accent" x="820" y="282" text-anchor="middle" dominant-baseline="central">3</text>
    <circle cx="919" cy="286" r="20" fill="var(--b-fill)"/><use href="#ic-resume" x="907" y="274" width="24" height="24" style="color:#1F6FB2"/>
    <text class="ct" x="919" y="318" text-anchor="middle" dominant-baseline="central" fill="var(--b-ink)">작업 재개</text>
    <text class="cs" x="919" y="344" text-anchor="middle" dominant-baseline="central">승인이 오는 즉시 이어간다</text>
  </g>
  <g>
    <rect x="1088" y="256" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="1114" cy="282" r="14" fill="var(--b-line)"/><text class="badge on-accent" x="1114" y="282" text-anchor="middle" dominant-baseline="central">4</text>
    <circle cx="1213" cy="286" r="20" fill="var(--b-fill)"/><use href="#ic-done" x="1201" y="274" width="24" height="24" style="color:#1F6FB2"/>
    <text class="ct" x="1213" y="318" text-anchor="middle" dominant-baseline="central" fill="var(--b-ink)">완료</text>
    <text class="cs" x="1213" y="344" text-anchor="middle" dominant-baseline="central">결과가 준비됐다</text>
  </g>

  <g fill="none" stroke="var(--b-line)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M464 311 H490"/>
    <path d="M758 311 H784"/>
    <path d="M1052 311 H1078"/>
  </g>

  <!-- cross-lane exchange at the Waiting column -->
  <path d="M596 404 V478" fill="none" stroke="var(--a-line)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ahX)"/>
  <path d="M664 478 V404" fill="none" stroke="var(--a-line)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ahX)"/>
  <text class="xlabel" x="586" y="441" text-anchor="end" dominant-baseline="central" fill="var(--a-ink)">대기 알림</text>
  <text class="xlabel" x="674" y="441" dominant-baseline="central" fill="var(--a-ink)">원클릭 승인</text>

  <!-- lane B -->
  <rect x="48" y="490" width="1304" height="170" rx="16" fill="var(--lane-b)" stroke="var(--hair)" stroke-width="1"/>
  <text class="lane" x="76" y="575" dominant-baseline="central" fill="var(--muted)">사용자</text>

  <g>
    <rect x="206" y="520" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--n-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="331" cy="550" r="20" fill="var(--n-fill)"/><use href="#ic-focus" x="319" y="538" width="24" height="24" style="color:#5B6675"/>
    <text class="ct" x="331" y="582" text-anchor="middle" dominant-baseline="central" fill="var(--ink)">다른 작업에 몰입</text>
    <text class="cs" x="331" y="608" text-anchor="middle" dominant-baseline="central">주의가 다른 곳에 있다</text>
  </g>
  <g>
    <rect x="500" y="520" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--a-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
    <circle cx="625" cy="550" r="20" fill="var(--a-fill)"/><use href="#ic-click" x="613" y="538" width="24" height="24" style="color:#D9A441"/>
    <text class="ct" x="625" y="582" text-anchor="middle" dominant-baseline="central" fill="var(--a-ink)">원클릭 승인</text>
    <text class="cs" x="625" y="608" text-anchor="middle" dominant-baseline="central">알림에서 바로 누른다</text>
  </g>
  <g>
    <rect x="794" y="520" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--n-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="919" cy="550" r="20" fill="var(--n-fill)"/><use href="#ic-flow" x="907" y="538" width="24" height="24" style="color:#5B6675"/>
    <text class="ct" x="919" y="582" text-anchor="middle" dominant-baseline="central" fill="var(--ink)">몰입 유지</text>
    <text class="cs" x="919" y="608" text-anchor="middle" dominant-baseline="central">흐름이 끊기지 않는다</text>
  </g>
  <g>
    <rect x="1088" y="520" width="250" height="110" rx="14" fill="var(--card)" stroke="var(--n-line)" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="1213" cy="550" r="20" fill="var(--n-fill)"/><use href="#ic-doc" x="1201" y="538" width="24" height="24" style="color:#5B6675"/>
    <text class="ct" x="1213" y="582" text-anchor="middle" dominant-baseline="central" fill="var(--ink)">결과 리뷰</text>
    <text class="cs" x="1213" y="608" text-anchor="middle" dominant-baseline="central">끝난 뒤에 확인한다</text>
  </g>

  <!-- legend -->
  <rect x="48" y="692" width="1304" height="60" rx="12" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <path d="M80 722 H120" fill="none" stroke="var(--b-line)" stroke-width="2.5" stroke-linecap="round"/>
  <text class="legend" x="132" y="722" dominant-baseline="central">실선 — lane 안에서의 상태 전이</text>
  <path d="M470 722 H510" fill="none" stroke="var(--a-line)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  <text class="legend" x="522" y="722" dominant-baseline="central">점선 — lane을 넘나드는 알림과 승인</text>
</svg>
