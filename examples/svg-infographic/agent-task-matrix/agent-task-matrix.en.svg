<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1070" width="1300" height="1070" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>AI Agent Task Selection Matrix</title>
  <desc>A two-by-two matrix placing agent work by scope and uncertainty. Narrow and low uncertainty is a quick fix you run directly; broad and low uncertainty is a guided change you plan first; narrow and high uncertainty is an investigation that gathers evidence before editing; broad and high uncertainty is a design review that needs cross-agent or red-team scrutiny.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD; --axis:#B4BEC9;
      --g-fill:#E7F5EF; --g-line:#0F7A5F; --g-ink:#085041;
      --b-fill:#E8F1FB; --b-line:#1F6FB2; --b-ink:#124267;
      --a-fill:#FDF3E3; --a-line:#D9A441; --a-ink:#8A5D14;
      --r-fill:#FBEDEC; --r-line:#C0544A; --r-ink:#8A322A; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:40px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:17px }
    .axis{ fill:var(--muted); font-size:15px; font-weight:650 }
    .axis-name{ fill:var(--ink); font-size:16px; font-weight:700; letter-spacing:0.04em }
    .qt{ font-size:26px; font-weight:700 }
    .qs{ fill:var(--muted); font-size:14.5px }
    .lbl{ fill:var(--muted); font-size:12.5px; font-weight:700; letter-spacing:0.09em }
    .ex{ fill:var(--ink); font-size:14.5px }
    .rec{ font-size:14.5px; font-weight:650 }
    .num{ font-size:18px; font-weight:700 }
    .caution{ font-size:12px; font-weight:700; letter-spacing:0.09em }
    .note{ fill:var(--muted); font-size:15px }
  </style>

  <defs>
    <marker id="axisHead" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#B4BEC9" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.10"/>
    </filter>
    <symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.5 4.5"/></symbol>
    <symbol id="ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="ic-fix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11a7.5 7.5 0 0 1 12.8-5.3L20 8"/><path d="M20 2.5V8h-5.5"/><path d="M8.5 15.5l2.4 2.4 4.6-4.8"/></symbol>
    <symbol id="ic-plan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h3M4 12h3M4 18h3"/><path d="M10 6h10M10 12h10M10 18h6"/></symbol>
  </defs>

  <rect width="1300" height="1070" fill="var(--bg)"/>

  <!-- header: computed title-keyline from the H1 line box (40px + 10px pad per side) -->
  <g data-layout-role="header-cluster" data-layout-tolerance="2">
    <rect data-layout-role="cluster-keyline" x="53" y="88" width="6" height="60" rx="3" fill="var(--primary)"/>
    <text data-layout-role="cluster-eyebrow" class="eyebrow" x="76" y="72" font-size="16" dominant-baseline="central">DECISION MATRIX</text>
    <text data-layout-role="cluster-h1" class="h1" x="76" y="118" font-size="40" dominant-baseline="central">AI Agent Task Selection Matrix</text>
    <text data-layout-role="cluster-subtitle" class="sub" x="76" y="176" font-size="17" dominant-baseline="central">Scope and uncertainty decide how you hand the work to an agent</text>
  </g>

  <!-- axes -->
  <path d="M120 834 V228" fill="none" stroke="var(--axis)" stroke-width="2" stroke-linecap="round" marker-end="url(#axisHead)"/>
  <text class="axis" x="104" y="240" text-anchor="end" dominant-baseline="central">high</text>
  <text class="axis" x="104" y="822" text-anchor="end" dominant-baseline="central">low</text>
  <text class="axis-name" x="120" y="202" text-anchor="middle" dominant-baseline="central">Uncertainty</text>

  <path d="M160 878 H1246" fill="none" stroke="var(--axis)" stroke-width="2" stroke-linecap="round" marker-end="url(#axisHead)"/>
  <text class="axis" x="160" y="904" dominant-baseline="central">narrow</text>
  <text class="axis" x="1252" y="904" text-anchor="end" dominant-baseline="central">broad</text>
  <text class="axis-name" x="706" y="904" text-anchor="middle" dominant-baseline="central">Scope</text>

  <!-- Q3 — Investigation (narrow · high) -->
  <g>
    <rect x="160" y="222" width="530" height="290" rx="20" fill="var(--card)" stroke="var(--a-line)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="216" cy="278" r="18" fill="var(--a-line)"/><text class="num on-accent" x="216" y="278" text-anchor="middle" dominant-baseline="central">3</text>
    <text class="qt" x="252" y="270" dominant-baseline="central" fill="var(--a-ink)">Investigation</text>
    <text class="qs" x="252" y="300" dominant-baseline="central">narrow scope · high uncertainty</text>
    <circle cx="632" cy="278" r="22" fill="var(--a-fill)"/><use href="#ic-search" x="619" y="265" width="26" height="26" style="color:#D9A441"/>
    <line x1="188" y1="328" x2="662" y2="328" stroke="var(--a-line)" stroke-opacity="0.38" stroke-width="1"/>
    <text class="lbl" x="188" y="356" dominant-baseline="central">EXAMPLES</text>
    <text class="ex" x="188" y="386" dominant-baseline="central">Tracing a bug to its cause, reading a broken render,</text>
    <text class="ex" x="188" y="412" dominant-baseline="central">making sense of a failure log</text>
    <rect x="188" y="442" width="330" height="36" rx="18" fill="var(--a-fill)"/>
    <text class="rec" x="212" y="460" dominant-baseline="central" fill="var(--a-ink)">Gather evidence, then edit least</text>
  </g>

  <!-- Q4 — Design Review (broad · high) — most caution -->
  <g>
    <rect x="722" y="222" width="530" height="290" rx="20" fill="var(--card)" stroke="var(--r-line)" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="778" cy="278" r="18" fill="var(--r-line)"/><text class="num on-accent" x="778" y="278" text-anchor="middle" dominant-baseline="central">4</text>
    <text class="qt" x="814" y="270" dominant-baseline="central" fill="var(--r-ink)">Design Review</text>
    <text class="qs" x="814" y="300" dominant-baseline="central">broad scope · high uncertainty</text>
    <rect x="1060" y="248" width="148" height="26" rx="13" fill="var(--r-line)"/>
    <text class="caution on-accent" x="1134" y="261" text-anchor="middle" dominant-baseline="central">MOST CAUTION</text>
    <circle cx="1194" cy="460" r="22" fill="var(--r-fill)"/><use href="#ic-shield" x="1181" y="447" width="26" height="26" style="color:#C0544A"/>
    <line x1="750" y1="328" x2="1224" y2="328" stroke="var(--r-line)" stroke-opacity="0.38" stroke-width="1"/>
    <text class="lbl" x="750" y="356" dominant-baseline="central">EXAMPLES</text>
    <text class="ex" x="750" y="386" dominant-baseline="central">Architecture direction, product positioning,</text>
    <text class="ex" x="750" y="412" dominant-baseline="central">redesigning a workflow</text>
    <rect x="750" y="442" width="360" height="36" rx="18" fill="var(--r-fill)"/>
    <text class="rec" x="774" y="460" dominant-baseline="central" fill="var(--r-ink)">Cross-agent or red-team review</text>
  </g>

  <!-- Q1 — Quick Fix (narrow · low) -->
  <g>
    <rect x="160" y="544" width="530" height="290" rx="20" fill="var(--card)" stroke="var(--g-line)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="216" cy="600" r="18" fill="var(--g-line)"/><text class="num on-accent" x="216" y="600" text-anchor="middle" dominant-baseline="central">1</text>
    <text class="qt" x="252" y="592" dominant-baseline="central" fill="var(--g-ink)">Quick Fix</text>
    <text class="qs" x="252" y="622" dominant-baseline="central">narrow scope · low uncertainty</text>
    <circle cx="632" cy="600" r="22" fill="var(--g-fill)"/><use href="#ic-fix" x="619" y="587" width="26" height="26" style="color:#0F7A5F"/>
    <line x1="188" y1="650" x2="662" y2="650" stroke="var(--g-line)" stroke-opacity="0.38" stroke-width="1"/>
    <text class="lbl" x="188" y="678" dominant-baseline="central">EXAMPLES</text>
    <text class="ex" x="188" y="708" dominant-baseline="central">Fixing a typo, filling a small test gap,</text>
    <text class="ex" x="188" y="734" dominant-baseline="central">tidying one document</text>
    <rect x="188" y="764" width="220" height="36" rx="18" fill="var(--g-fill)"/>
    <text class="rec" x="212" y="782" dominant-baseline="central" fill="var(--g-ink)">Just run it</text>
  </g>

  <!-- Q2 — Guided Change (broad · low) -->
  <g>
    <rect x="722" y="544" width="530" height="290" rx="20" fill="var(--card)" stroke="var(--b-line)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="778" cy="600" r="18" fill="var(--b-line)"/><text class="num on-accent" x="778" y="600" text-anchor="middle" dominant-baseline="central">2</text>
    <text class="qt" x="814" y="592" dominant-baseline="central" fill="var(--b-ink)">Guided Change</text>
    <text class="qs" x="814" y="622" dominant-baseline="central">broad scope · low uncertainty</text>
    <circle cx="1194" cy="600" r="22" fill="var(--b-fill)"/><use href="#ic-plan" x="1181" y="587" width="26" height="26" style="color:#1F6FB2"/>
    <line x1="750" y1="650" x2="1224" y2="650" stroke="var(--b-line)" stroke-opacity="0.38" stroke-width="1"/>
    <text class="lbl" x="750" y="678" dominant-baseline="central">EXAMPLES</text>
    <text class="ex" x="750" y="708" dominant-baseline="central">A repetitive refactor, restructuring docs,</text>
    <text class="ex" x="750" y="734" dominant-baseline="central">updating every example at once</text>
    <rect x="750" y="764" width="250" height="36" rx="18" fill="var(--b-fill)"/>
    <text class="rec" x="774" y="782" dominant-baseline="central" fill="var(--b-ink)">Plan first, then run</text>
  </g>

  <!-- note -->
  <rect x="48" y="934" width="1204" height="60" rx="12" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <text class="note" x="76" y="964" dominant-baseline="central">Rule of thumb: uncertainty decides how deep the review goes; scope decides how much planning comes first.</text>
</svg>
