<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="1060" height="680" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Issue Tracker ↔ CI/CD Approval Flow</title>
  <desc>Five steps tie one issue key to a release. The developer references the key in the branch and commits, CI records the artifact digest, the same digest is deployed to test, an approver transitions the ticket at the approval gate, and CI ships that same digest to production. The issue state rail on the right tracks TICKET-123 from Open through Deployed.</desc>

  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC; --primary:#1F6FB2;
      --card:#FFFFFF; --strip:#F7FAFD; --rail:#F4F8FC;
      --n-fill:#EEF1F4; --n-line:#C3CBD4; --n-ink:#4A5563;
      --b-fill:#E8F1FB; --b-line:#1F6FB2; --b-ink:#124267;
      --a-fill:#FDF3E3; --a-line:#D9A441; --a-ink:#8A5D14;
      --g-fill:#E7F5EF; --g-line:#0F7A5F; --g-ink:#085041; }
    .on-accent{ fill:#FFFFFF }
    .eyebrow{ fill:var(--primary); font-size:16px; font-weight:700; letter-spacing:0.10em }
    .h1{ fill:var(--ink); font-size:34px; font-weight:700 }
    .sub{ fill:var(--muted); font-size:16px }
    .col{ fill:var(--muted); font-size:12.5px; font-weight:700; letter-spacing:0.08em }
    .st{ font-size:16px; font-weight:700 }
    .sd{ fill:var(--muted); font-size:12.5px }
    .num{ font-size:14px; font-weight:700 }
    .chip{ font-size:14px; font-weight:650 }
    .note{ fill:var(--muted); font-size:12.5px }
  </style>

  <defs>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2733" flood-opacity="0.09"/>
    </filter>
    <symbol id="ic-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="ic-build" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></symbol>
    <symbol id="ic-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></symbol>
    <symbol id="ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="ic-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.3A3.5 3.5 0 0 1 18 18z"/></symbol>
  </defs>

  <rect width="1060" height="680" fill="var(--bg)"/>

  <!-- header: rail from eyebrowTop(56) to titleBottom(121) -->
  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16"
     data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="40" y="40" width="6" height="81" rx="3" fill="var(--primary)"/>
    <text data-layout-role="title-eyebrow" class="eyebrow" x="68" y="64" font-size="16" dominant-baseline="middle">RELEASE GOVERNANCE</text>
    <text data-layout-role="title-line" class="h1" x="68" y="104" font-size="34" dominant-baseline="middle">Issue Tracker ↔ CI/CD Approval Flow</text>
    <text data-layout-role="title-subtitle" class="sub" x="68" y="150" font-size="16" dominant-baseline="middle">One issue key threads commit, build, deploy, and approval</text>
  </g>

  <!-- issue state rail -->
  <rect x="792" y="194" width="228" height="346" rx="14" fill="var(--rail)" stroke="var(--hair)" stroke-width="1"/>
  <text class="col" x="906" y="176" text-anchor="middle" dominant-baseline="central">ISSUE STATE · TICKET-123</text>

  <!-- spine -->
  <path d="M76 223 V511" fill="none" stroke="var(--hair)" stroke-width="3" stroke-linecap="round"/>

  <!-- step 1 -->
  <circle cx="76" cy="223" r="15" fill="var(--b-line)"/><text class="num on-accent" x="76" y="223" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="112" y="194" width="640" height="58" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="142" cy="223" r="20" fill="var(--b-fill)"/><use href="#ic-person" x="130" y="211" width="24" height="24" style="color:#1F6FB2"/>
  <text class="st" x="176" y="213" dominant-baseline="central" fill="var(--b-ink)">Developer registers the ticket</text>
  <text class="sd" x="176" y="234" dominant-baseline="central">The issue key is referenced in the branch and commits — feature/TICKET-123</text>
  <rect x="816" y="204" width="180" height="38" rx="10" fill="var(--n-fill)" stroke="var(--n-line)" stroke-width="1"/>
  <text class="chip" x="906" y="223" text-anchor="middle" dominant-baseline="central" fill="var(--n-ink)">Open</text>

  <!-- step 2 -->
  <circle cx="76" cy="295" r="15" fill="var(--b-line)"/><text class="num on-accent" x="76" y="295" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="112" y="266" width="640" height="58" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="142" cy="295" r="20" fill="var(--b-fill)"/><use href="#ic-build" x="130" y="283" width="24" height="24" style="color:#1F6FB2"/>
  <text class="st" x="176" y="285" dominant-baseline="central" fill="var(--b-ink)">CI pipeline builds and records</text>
  <text class="sd" x="176" y="306" dominant-baseline="central">The artifact digest is stored and the ticket state moves forward</text>
  <rect x="816" y="276" width="180" height="38" rx="10" fill="var(--b-fill)" stroke="var(--b-line)" stroke-width="1"/>
  <text class="chip" x="906" y="295" text-anchor="middle" dominant-baseline="central" fill="var(--b-ink)">In Progress</text>

  <!-- step 3 -->
  <circle cx="76" cy="367" r="15" fill="var(--b-line)"/><text class="num on-accent" x="76" y="367" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="112" y="338" width="640" height="58" rx="12" fill="var(--card)" stroke="var(--b-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="142" cy="367" r="20" fill="var(--b-fill)"/><use href="#ic-server" x="130" y="355" width="24" height="24" style="color:#1F6FB2"/>
  <text class="st" x="176" y="357" dominant-baseline="central" fill="var(--b-ink)">Test environment takes the same digest</text>
  <text class="sd" x="176" y="378" dominant-baseline="central">The same @digest is deployed and the QA result is attached</text>
  <rect x="816" y="348" width="180" height="38" rx="10" fill="var(--a-fill)" stroke="var(--a-line)" stroke-width="1"/>
  <text class="chip" x="906" y="367" text-anchor="middle" dominant-baseline="central" fill="var(--a-ink)">In Test</text>

  <!-- step 4 — approval gate -->
  <circle cx="76" cy="439" r="15" fill="var(--a-line)"/><text class="num on-accent" x="76" y="439" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="112" y="410" width="640" height="58" rx="12" fill="var(--card)" stroke="var(--a-line)" stroke-width="2.5" filter="url(#cardShadow)"/>
  <circle cx="142" cy="439" r="20" fill="var(--a-fill)"/><use href="#ic-shield" x="130" y="427" width="24" height="24" style="color:#D9A441"/>
  <text class="st" x="176" y="429" dominant-baseline="central" fill="var(--a-ink)">Approval gate in the issue tracker</text>
  <text class="sd" x="176" y="450" dominant-baseline="central">An approver transitions the ticket; approver and time are logged automatically</text>
  <rect x="816" y="420" width="180" height="38" rx="10" fill="var(--g-fill)" stroke="var(--g-line)" stroke-width="1"/>
  <text class="chip" x="906" y="439" text-anchor="middle" dominant-baseline="central" fill="var(--g-ink)">Approved</text>

  <!-- step 5 -->
  <circle cx="76" cy="511" r="15" fill="var(--g-line)"/><text class="num on-accent" x="76" y="511" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="112" y="482" width="640" height="58" rx="12" fill="var(--card)" stroke="var(--g-line)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="142" cy="511" r="20" fill="var(--g-fill)"/><use href="#ic-cloud" x="130" y="499" width="24" height="24" style="color:#0F7A5F"/>
  <text class="st" x="176" y="501" dominant-baseline="central" fill="var(--g-ink)">CI pipeline ships to production</text>
  <text class="sd" x="176" y="522" dominant-baseline="central">It checks the approval state first, then deploys that same @digest</text>
  <rect x="816" y="492" width="180" height="38" rx="10" fill="var(--g-line)"/>
  <text class="chip on-accent" x="906" y="511" text-anchor="middle" dominant-baseline="central">Deployed</text>

  <!-- footer -->
  <rect x="40" y="572" width="980" height="68" rx="12" fill="var(--strip)" stroke="var(--hair)" stroke-width="1"/>
  <text class="note" x="68" y="594" dominant-baseline="central">The pipeline records and reads state through the tracker API and webhooks — the developer only references the issue key.</text>
  <text class="note" x="68" y="620" dominant-baseline="central">Manual-approval variant: step 4 becomes an email or checklist sign-off plus a pipeline input gate instead of a state transition.</text>
</svg>
