<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img"
     style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>AI 에이전트 개발은 루프를 돌리는 일입니다</title>
  <desc>목표, 계획, 실행, 관찰, 평가를 반복하고 운영 기반 위에 실행, 맥락, 조율 역량을 필요한 만큼 쌓는 AI 에이전트 개발 모델이다.</desc>

  <defs>
    <marker id="ah-edge-v2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#2E6DA4" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="900" fill="#F7F7F5" data-fill-role="canvas"/>

  <!-- Header -->
  <text x="52" y="43" font-size="14" letter-spacing="1.5" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">AI AGENT DEVELOPMENT ROADMAP</text>
  <rect x="36" y="51" width="4" height="42" rx="2" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="52" y="72" font-size="28" font-weight="700" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">AI 에이전트 개발은 루프를 돌리는 일입니다</text>
  <text x="52" y="101" font-size="14" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">목표 → 계획 → 실행 → 관찰 → 평가를 반복하며 필요한 역량을 보강합니다</text>

  <!-- Agent loop: clockwise, radius 105 around (360,332) -->
  <g fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linecap="round" data-stroke-role="edge-line">
    <path d="M394.2 232.7 A105 105 0 0 1 442.7 267.4" marker-end="url(#ah-edge-v2)"/>
    <path d="M465 333.8 A105 105 0 0 1 447 390.7" marker-end="url(#ah-edge-v2)"/>
    <path d="M390.7 432.4 A105 105 0 0 1 331.1 432.9" marker-end="url(#ah-edge-v2)"/>
    <path d="M274 392.2 A105 105 0 0 1 255.1 335.7" marker-end="url(#ah-edge-v2)"/>
    <path d="M276.1 268.8 A105 105 0 0 1 324.1 233.3" marker-end="url(#ah-edge-v2)"/>
  </g>

  <!-- Core -->
  <circle cx="360" cy="332" r="52" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.5"
          data-fill-role="surface" data-stroke-role="edge-line"/>
  <g transform="translate(351,296) scale(0.75)">
    <path d="M4.5 12 A7.5 7.5 0 0 1 17.3 6.7 L20 9 M20 3.5 V9 H14.5 M19.5 12 A7.5 7.5 0 0 1 6.7 17.3 L4 15 M4 20.5 V15 H9.5"
          fill="none" stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          data-stroke-role="edge-line"/>
  </g>
  <text x="360" y="327" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">Agent Core</text>
  <text x="360" y="346" font-size="10.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">Model · Context</text>

  <!-- Goal -->
  <text x="360" y="169" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">목표 · Goal</text>
  <text x="360" y="186" font-size="10.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">성공 기준을 정한다</text>
  <circle cx="360" cy="227" r="28" fill="#EAF0F6" data-fill-role="icon-tint"/>
  <g transform="translate(345,212) scale(1.25)">
    <path d="M6 3 V21 M6 4 H18 L15 8 L18 12 H6" fill="none" stroke="#2E6DA4" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/>
  </g>

  <!-- Plan -->
  <circle cx="459.9" cy="299.6" r="28" fill="#EAF0F6" data-fill-role="icon-tint"/>
  <g transform="translate(444.9,284.6) scale(1.25)">
    <path d="M6 3 H14 L18 7 V21 H6 Z M14 3 V7 H18 M9 13 H15 M9 16.5 H15 M9 9.5 H11"
          fill="none" stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          data-stroke-role="edge-line"/>
  </g>
  <text x="500" y="293" font-size="14" font-weight="700" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">계획 · Plan</text>
  <text x="500" y="310" font-size="10.5" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">단계와 제약을 정한다</text>

  <!-- Act -->
  <circle cx="421.7" cy="416.9" r="28" fill="#EAF0F6" data-fill-role="icon-tint"/>
  <g transform="translate(406.7,401.9) scale(1.25)">
    <path d="M5.5 4 H18.5 A2.5 2.5 0 0 1 21 6.5 V17.5 A2.5 2.5 0 0 1 18.5 20 H5.5 A2.5 2.5 0 0 1 3 17.5 V6.5 A2.5 2.5 0 0 1 5.5 4 M7 9 L10 12 L7 15 M13 15 H17"
          fill="none" stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          data-stroke-role="edge-line"/>
  </g>
  <text x="421.7" y="459" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">실행 · Act</text>
  <text x="421.7" y="476" font-size="10.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">허용된 도구로 행동</text>

  <!-- Observe -->
  <circle cx="298.3" cy="416.9" r="28" fill="#EAF0F6" data-fill-role="icon-tint"/>
  <g transform="translate(283.3,401.9) scale(1.25)">
    <path d="M2 12 L7 12 L10 5 L14 19 L17 12 L22 12" fill="none" stroke="#2E6DA4" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/>
  </g>
  <text x="298.3" y="459" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">관찰 · Observe</text>
  <text x="298.3" y="476" font-size="10.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">결과와 과정을 기록</text>

  <!-- Evaluate: emphasized because it closes the learning loop -->
  <circle cx="260.1" cy="299.6" r="28" fill="#2E6DA4" data-fill-role="focus"/>
  <g transform="translate(245.1,284.6) scale(1.25)">
    <path d="M4 12 L10 18 L20 6" fill="none" stroke="#FFFFFF" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" data-stroke-role="on-focus"/>
  </g>
  <text x="220" y="293" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">평가 · Evaluate</text>
  <text x="220" y="310" font-size="10.5" text-anchor="end" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">다음 반복을 선택</text>

  <!-- Capability stack -->
  <text x="36" y="510" font-size="16" font-weight="700" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">루프를 강하게 만드는 4개 역량</text>
  <text x="684" y="510" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">기반 위에 필요한 만큼</text>

  <!-- Coordination: top / optional -->
  <rect x="36" y="528" width="648" height="60" rx="12" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1"
        data-fill-role="surface" data-stroke-role="rule"/>
  <circle cx="68" cy="558" r="18" fill="#EFEEF6" data-fill-role="api-fill"/>
  <g transform="translate(58,548) scale(0.833)">
    <path d="M14.5 5 A2.5 2.5 0 1 1 9.5 5 A2.5 2.5 0 1 1 14.5 5 M7.5 19 A2.5 2.5 0 1 1 2.5 19 A2.5 2.5 0 1 1 7.5 19 M21.5 19 A2.5 2.5 0 1 1 16.5 19 A2.5 2.5 0 1 1 21.5 19 M12 7.5 V13 M12 13 L7 17 M12 13 L17 17"
          fill="none" stroke="#5B54A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          data-stroke-role="api-line"/>
  </g>
  <text x="96" y="549" font-size="14" font-weight="700" dominant-baseline="central"
        fill="#322E5C" data-fill-role="api-ink">조율 · Coordination</text>
  <text x="96" y="568" font-size="10.5" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">복잡할 때만 역할과 흐름을 나눔</text>
  <rect x="305" y="546" width="115" height="24" rx="12" fill="#EFEEF6" data-fill-role="api-fill"/>
  <text x="362.5" y="558" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#322E5C" data-fill-role="api-ink">Workflow</text>
  <rect x="430" y="546" width="115" height="24" rx="12" fill="#EFEEF6" data-fill-role="api-fill"/>
  <text x="487.5" y="558" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#322E5C" data-fill-role="api-ink">Handoff</text>
  <rect x="555" y="546" width="115" height="24" rx="12" fill="#EFEEF6" data-fill-role="api-fill"/>
  <text x="612.5" y="558" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#322E5C" data-fill-role="api-ink">Multi-Agent</text>

  <!-- Context -->
  <rect x="36" y="600" width="648" height="60" rx="12" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1"
        data-fill-role="surface" data-stroke-role="rule"/>
  <circle cx="68" cy="630" r="18" fill="#ECF4F1" data-fill-role="compute-fill"/>
  <g transform="translate(58,620) scale(0.833)">
    <path d="M4 6 A8 3 0 1 0 20 6 A8 3 0 1 0 4 6 M4 6 V18 A8 3 0 0 0 20 18 V6"
          fill="none" stroke="#3F8F72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          data-stroke-role="compute-line"/>
  </g>
  <text x="96" y="621" font-size="14" font-weight="700" dominant-baseline="central"
        fill="#234F3F" data-fill-role="compute-ink">맥락 · Context</text>
  <text x="96" y="640" font-size="10.5" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">다음 판단에 필요한 상태와 근거</text>
  <rect x="305" y="618" width="115" height="24" rx="12" fill="#ECF4F1" data-fill-role="compute-fill"/>
  <text x="362.5" y="630" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#234F3F" data-fill-role="compute-ink">RAG</text>
  <rect x="430" y="618" width="115" height="24" rx="12" fill="#ECF4F1" data-fill-role="compute-fill"/>
  <text x="487.5" y="630" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#234F3F" data-fill-role="compute-ink">Session State</text>
  <rect x="555" y="618" width="115" height="24" rx="12" fill="#ECF4F1" data-fill-role="compute-fill"/>
  <text x="612.5" y="630" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#234F3F" data-fill-role="compute-ink">Memory</text>

  <!-- Action -->
  <rect x="36" y="672" width="648" height="60" rx="12" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1"
        data-fill-role="surface" data-stroke-role="rule"/>
  <circle cx="68" cy="702" r="18" fill="#EAF0F6" data-fill-role="edge-fill"/>
  <g transform="translate(58,692) scale(0.833)">
    <path d="M12 9 A3 3 0 1 0 12 15 A3 3 0 1 0 12 9 M19.4 15 A1.65 1.65 0 0 0 19.73 16.82 L19.79 16.88 A2 2 0 1 1 16.96 19.71 L16.9 19.65 A1.65 1.65 0 0 0 15.08 19.32 A1.65 1.65 0 0 0 14.08 20.83 V21 A2 2 0 0 1 10.08 21 V20.91 A1.65 1.65 0 0 0 9 19.4 A1.65 1.65 0 0 0 7.18 19.73 L7.12 19.79 A2 2 0 1 1 4.29 16.96 L4.35 16.9 A1.65 1.65 0 0 0 4.68 15.08 A1.65 1.65 0 0 0 3.17 14.08 H3 A2 2 0 0 1 3 10.08 H3.09 A1.65 1.65 0 0 0 4.6 9 A1.65 1.65 0 0 0 4.27 7.18 L4.21 7.12 A2 2 0 1 1 7.04 4.29 L7.1 4.35 A1.65 1.65 0 0 0 8.92 4.68 H9 A1.65 1.65 0 0 0 10 3.17 V3 A2 2 0 0 1 14 3 V3.09 A1.65 1.65 0 0 0 15 4.6 A1.65 1.65 0 0 0 16.82 4.27 L16.88 4.21 A2 2 0 1 1 19.71 7.04 L19.65 7.1 A1.65 1.65 0 0 0 19.32 8.92 V9 A1.65 1.65 0 0 0 20.83 10 H21 A2 2 0 0 1 21 14 H20.91 A1.65 1.65 0 0 0 19.4 15"
          fill="none" stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          data-stroke-role="edge-line"/>
  </g>
  <text x="96" y="693" font-size="14" font-weight="700" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">실행 · Action</text>
  <text x="96" y="712" font-size="10.5" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">외부 행동의 범위와 권한을 제한</text>
  <rect x="305" y="690" width="115" height="24" rx="12" fill="#EAF0F6" data-fill-role="edge-fill"/>
  <text x="362.5" y="702" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">Tool Calling</text>
  <rect x="430" y="690" width="115" height="24" rx="12" fill="#EAF0F6" data-fill-role="edge-fill"/>
  <text x="487.5" y="702" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">MCP · API</text>
  <rect x="555" y="690" width="115" height="24" rx="12" fill="#EAF0F6" data-fill-role="edge-fill"/>
  <text x="612.5" y="702" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">권한 · 승인</text>

  <!-- Operational foundation: emphasized -->
  <rect x="36" y="744" width="648" height="84" rx="12" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1.2"
        data-fill-role="edge-fill" data-stroke-role="edge-line"/>
  <circle cx="68" cy="786" r="18" fill="#FFFFFF" data-fill-role="surface"/>
  <g transform="translate(58,776) scale(0.833)">
    <path d="M12 3 L20 6 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V6 Z"
          fill="none" stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
          data-stroke-role="edge-line"/>
  </g>
  <text x="96" y="775" font-size="14" font-weight="700" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">운영 기반 · Foundation</text>
  <text x="96" y="798" font-size="10.5" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">측정·추적·통제 없이는 확장하지 않음</text>
  <rect x="305" y="758" width="115" height="56" rx="14" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="0.9"
        data-fill-role="surface" data-stroke-role="edge-line"/>
  <text x="362.5" y="774" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">Evals</text>
  <text x="362.5" y="798" font-size="10.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">평가 체계</text>
  <rect x="430" y="758" width="115" height="56" rx="14" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="0.9"
        data-fill-role="surface" data-stroke-role="edge-line"/>
  <text x="487.5" y="774" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">Observability</text>
  <text x="487.5" y="798" font-size="10.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">관측 가능성</text>
  <rect x="555" y="758" width="115" height="56" rx="14" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="0.9"
        data-fill-role="surface" data-stroke-role="edge-line"/>
  <text x="612.5" y="774" font-size="11.5" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">Security</text>
  <text x="612.5" y="798" font-size="10.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">보안</text>

  <text x="684" y="870" font-size="11" text-anchor="end" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">kyungseo.github.io</text>
</svg>
