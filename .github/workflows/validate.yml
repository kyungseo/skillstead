# Event-driven validation (M1). Deliberately separate from the periodic
# workflow (validate-periodic.yml) so that disabling either one — including
# GitHub's automatic 60-day-inactivity disable of scheduled workflows — never
# silences the other. Continuous tag checks (M3) and the cutover evaluator
# (M4) are added by later stages of the validator work.
#
# The two heavy suites run as parallel jobs, and on pull_request events they
# run only when the change set touches their inputs (the `scope` job derives
# that from the diff, fail-closed to "run everything" when it cannot tell).
# The SVG suite is package-specific; changing another independent skill does
# not make that suite relevant. SVG package/example changes also run the
# validator suite because repository fixtures invoke those scripts directly.
# Push runs always run everything, and the daily periodic
# workflow stays full, so a scoping mistake on a PR is caught at the merge
# push at the latest. The `validate` job aggregates the results under the
# historical check name.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  create:
  delete:

permissions:
  contents: read

jobs:
  # PR-only diff classification; push runs get "run everything" without a
  # checkout. A failed diff also means "run everything" — never skip on an
  # unobserved change set.
  scope:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      svg_infographic: ${{ steps.diff.outputs.svg_infographic }}
      validator: ${{ steps.diff.outputs.validator }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        run: |
          set -u
          run_all() {
            echo "svg_infographic=true" >> "$GITHUB_OUTPUT"
            echo "validator=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            run_all
          fi
          # --no-renames exposes both sides of a move, so moving a file out of
          # an SVG input path cannot hide the removed path from classification.
          changed="$(git -c core.quotePath=off diff --name-only --no-renames "origin/${GITHUB_BASE_REF}...HEAD")" || run_all
          classified="$(printf '%s\n' "$changed" | \
            PYTHONPATH=tools python3 -m skillstead_validate.ci_scope)" || run_all
          printf '%s\n' "$classified" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  svg-infographic-suite:
    needs: scope
    if: needs.scope.outputs.svg_infographic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The package's own suite subsets fonts, and its subsetter-dependent fixtures used to skip
      # themselves silently when the toolchain was absent — which is what CI looked like, so those
      # fixtures had never run here. The pins match references/delivery/font-delivery-v1.yaml; a
      # mismatch is refused by the wrapper itself, so drift cannot pass as an acceptance build.
      - name: Pinned font subsetter
        run: |
          python3 -m venv /tmp/svginfo-fonts
          /tmp/svginfo-fonts/bin/pip install --quiet 'fonttools==4.53.1' 'brotli==1.1.0'
          /tmp/svginfo-fonts/bin/python -c "import fontTools, importlib.metadata as m; print('fonttools', fontTools.version, 'brotli', m.version('brotli'))"

      - name: Package suite (svg-infographic, strict)
        env:
          SVGINFO_PYTHON: /tmp/svginfo-fonts/bin/python
          SVGINFO_STRICT: "1"        # absence of the subsetter fails here; it never silently skips
        run: bash skills/svg-infographic/scripts/run-tests.sh

  validator-suite:
    needs: scope
    if: needs.scope.outputs.validator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validator self-tests (fixtures)
        run: python3 -m unittest discover -s tests

  # Full hydration is contractual: first-parent history, all tags, and
  # origin/main must be observable for the tag and cutover checks.
  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Repo validation (M1)
        run: PYTHONPATH=tools python3 -m skillstead_validate repo --repo-root .

      - name: Gallery model drift (CP3B)
        run: PYTHONPATH=tools python3 -m skillstead_validate gallery --repo-root .

      # The release protocol creates the tag only after the version-bump
      # commit has merged, so this push/PR run may observe the merge→tag
      # window. The bounded grace turns exactly that window into a visible
      # I-5-PENDING notice instead of a red run; tag events and the periodic
      # workflow run without grace, so a genuinely deleted tag still fails
      # there immediately and a never-created tag hardens after the window.
      - name: Continuous tag checks (M3)
        run: |
          set -u
          main_ref=origin/main
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # The checked-out PR merge ref is the candidate post-merge state.
            # Using origin/main here would make a validator repair PR prove
            # only that the still-broken base is broken.
            main_ref=HEAD
          fi
          PYTHONPATH=tools python3 -m skillstead_validate tags --main-ref "$main_ref" --repo-root . --release-grace-minutes 1440

      - name: Cutover verdict (M4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=tools python3 -m skillstead_validate cutover --live --repo-slug "$GITHUB_REPOSITORY" --main-ref origin/main --repo-root .

      - name: Spec reference validator (pinned skills-ref)
        run: python3 tools/run_skills_ref.py

  # Aggregate under the historical check name: green only when every job that
  # was supposed to run succeeded, and a skipped heavy suite is acceptable
  # only when `scope` explicitly ruled it out.
  validate:
    needs: [scope, svg-infographic-suite, validator-suite, checks]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          set -u
          fail() { echo "$1" >&2; exit 1; }
          [ "${{ needs.scope.result }}" = "success" ] || fail "scope job did not succeed"
          [ "${{ needs.checks.result }}" = "success" ] || fail "checks job did not succeed"
          suite_ok() {
            result="$1"; wanted="$2"; name="$3"
            case "$wanted" in
              true)
                [ "$result" = "success" ] || fail "$name was required but did not succeed"
                ;;
              false)
                case "$result" in
                  success|skipped) : ;;
                  *) fail "$name failed" ;;
                esac
                ;;
              *) fail "$name has unknown scope decision: ${wanted:-<empty>}" ;;
            esac
          }
          suite_ok "${{ needs.svg-infographic-suite.result }}" "${{ needs.scope.outputs.svg_infographic }}" "svg-infographic-suite"
          suite_ok "${{ needs.validator-suite.result }}" "${{ needs.scope.outputs.validator }}" "validator-suite"
          echo "all required jobs green"

  # Tag creation or deletion re-runs the continuous tag checks immediately
  # (a deleted tag leaves no ref to check out, so main is checked out
  # explicitly). Branch create/delete events say nothing about tag state, so
  # they are filtered out here — before the filter every release left a red
  # run from the branch auto-delete that fired inside the merge→tag window.
  tag-event:
    if: (github.event_name == 'create' || github.event_name == 'delete') && github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Continuous tag checks (M3)
        run: PYTHONPATH=tools python3 -m skillstead_validate tags --main-ref origin/main --repo-root .

      - name: Cutover verdict (M4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=tools python3 -m skillstead_validate cutover --live --repo-slug "$GITHUB_REPOSITORY" --main-ref origin/main --repo-root .
