# Publish only the human-facing gallery and its example assets. The installed
# skill, validation tools, tests, docs, and release records are deliberately
# excluded from the Pages artifact.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble bounded site
        run: |
          set -eu
          if find gallery examples -type l -print -quit | grep -q .; then
            echo "Pages source must not contain symlinks" >&2
            exit 1
          fi
          mkdir -p _site
          cp -R gallery _site/gallery
          cp -R examples _site/examples
          find _site/examples -type f ! \( -name '*.svg' -o -name '*.json' \) -delete
          if find _site/examples -type f ! \( -name '*.svg' -o -name '*.json' \) -print -quit | grep -q .; then
            echo "Pages examples must contain only SVG and JSON files" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
