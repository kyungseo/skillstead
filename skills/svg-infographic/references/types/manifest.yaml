# TypePack manifest — single registration point for diagram/infographic types.
# Adding a type = one TypePack directory + one entry here. Core engine (generic lint,
# renderer, resolver) is not modified by type additions (kernel invariant).
#
# Entry schema (locked with the design kernel, 2026-08):
#   id:               unique kebab-case
#   selection_signal: content signals that route a request to this type (the
#                     selection table is DERIVED from these — no hand-kept copy)
#   profile:          exact-parametric | constrained-layout | editorial-composition
#   support:          core | experimental | gated   # charts stay gated until their
#                                                   # machine verifier + receipt exist;
#                                                   # gated types must not appear in
#                                                   # discovery copy or the cookbook
#   spec:             types/specs/<id>.md           # 1:1 with this entry — the spec's
#                                                   # frontmatter (spec_schema_version /
#                                                   # typepack_id / profile) must match,
#                                                   # sections 1–9 must be complete, the
#                                                   # path must be unique, and the specs
#                                                   # tree must have no orphan file
#   presets:          supported output presets (PageFrame registry ids, e.g. social-4x5)
#   orientations:     supported orientations (portrait | landscape | square) — kept
#                     separate from presets; preset ids never encode orientation
#   verifier:         null | scripts path           # required for accuracy-bearing types
#   fixtures:         [] | paths                    # baseline-red/positive pairs
#   examples:         [] | example ids              # gallery mapping
#   required_roles:   Foundation roles the type consumes (resolver checks coverage)
#   optional_aliases: domain aliases the type may consume
#   canonical_prompt: { status, anchor }            # status: reserved | bound.
#                                                   # reserved = anchor format+uniqueness
#                                                   # only (the gallery does not exist
#                                                   # yet); bound = the target file and
#                                                   # anchor must exist (fail-closed)
#   annexes:          [] | [topology|data-accuracy] # profile-specific spec annexes the
#                                                   # spec must also carry
#   gate:             null | { reason, release }    # required when support: gated —
#                                                   # gated types are withheld from the
#                                                   # routable view but stay auditable
#   legacy_section:   null | "<archetypes heading>" # the legacy section this TypePack
#                                                   # replaces; that section must be a
#                                                   # pointer tombstone, not a rival rule
#   composition:      OPTIONAL capability block (schema v2). Absent => the TypePack
#                     is composable: false. Fields:
#     composable: true|false
#     min_slot_size: { w, h }        # logical px, the inner content area the
#                                    # fragment's intrinsic bounds must fit (slot
#                                    # padding excluded, scale profile applied later)
#     preferred_slot_aspect: { min, max }   # slot(=할당 영역) aspect range — page
#                                    # aspect는 presets/orientations가 소유
#     allowed_slots: [top, bottom]   # template 위치 enum(top/middle/bottom/side) —
#                                    # plan의 slot binding이 이 범위를 벗어나면 거부
#     variants: [ { id, min_slot_size: {w,h} } ]  # composition이 선택하는 local
#                                    # degrade variants (의미 축약은 receipt에 기록)
#     ports: [ { template, direction: out|in|bidir, kind: flow|reference,
#                cardinality: "n" | "n..m" | "0..n" } ]  # capability만 — 실제
#                                    # port는 instance receipt가 산출
#
# Schema upgrade policy (v1 -> v2, atomic package upgrade): the validator and every
# manifest in the package move to v2 in the same commit — mixed versions are
# rejected fail-closed. Existing TypePacks migrate without a composition block and
# are therefore composable: false until they opt in.
#
# Validation gate: unique ids, spec identity/section/inventory closure, unique prompt
# anchors with their reserved|bound state, promotion evidence for `core`, gate reason
# for `gated`, legacy tombstone closure, and the derived selection view. TypePacks
# declare role requirements only — no hex values, no palette ids.
#
# Promotion: `experimental` is a preview state. `core` additionally requires at least
# one registered example and profile-appropriate verification evidence (fixtures for
# every profile; a machine verifier as well for exact-parametric / data-accuracy).
#
# Population happens as the archetype catalog migrates to TypePacks; pilots
# register here only when promoted.

schema_version: 2

# Wave 1 migration in progress: the archetype catalog moves here one TypePack at a
# time. `support` stays `experimental` until a type has its examples and fixtures;
# `gated` types are registered but withheld from discovery copy.

typepacks:
  - id: cards-kpi-grid
    selection_signal: "핵심 항목·수치 몇 개를 동등한 카드로 요약 (feature highlight·원칙·상태 카운트·역량 요약; 데이터 정확성을 주장하는 chart가 아님)"
    profile: constrained-layout
    support: experimental
    spec: types/specs/cards-kpi-grid.md
    presets: [social-4x5, presentation-16x9]
    orientations: [portrait, landscape]
    verifier: null
    fixtures: []
    examples: []
    required_roles: [canvas, surface, ink, muted, rule, focus]
    optional_aliases: []
    canonical_prompt: { status: reserved, anchor: PROMPT-GALLERY.md#cards-kpi-grid }
    annexes: []
    gate: null
    legacy_section: "Cards / KPI stat grid"
    composition:
      composable: true
      min_slot_size: { w: 640, h: 240 }
      preferred_slot_aspect: { min: 1.8, max: 3.2 }
      allowed_slots: [top, middle]
      variants:
        - id: compact
          min_slot_size: { w: 640, h: 180 }
      ports:
        - { template: item-anchor, direction: out, kind: reference, cardinality: 0..n }
  - id: layer-stack
    selection_signal: "아래 층을 기반으로 쌓이거나 추상화하는 계층 구조 (플랫폼 스택·런타임 계층·역량 모델)"
    profile: constrained-layout
    support: experimental
    spec: types/specs/layer-stack.md
    presets: [social-4x5, presentation-16x9]
    orientations: [portrait, landscape]
    verifier: null
    fixtures: []
    examples: []
    required_roles: [canvas, surface, ink, muted, rule, focus]
    optional_aliases: []
    canonical_prompt: { status: reserved, anchor: PROMPT-GALLERY.md#layer-stack }
    annexes: []
    gate: null
    legacy_section: "Layer stack"
