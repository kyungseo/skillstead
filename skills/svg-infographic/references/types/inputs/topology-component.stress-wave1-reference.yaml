schema_version: 1
kind: typepack-input
typepack: topology-component
case: stress-wave1-reference
preset: social-4x5
layout: zones
variant: regular
purpose: wave1-reference
count: 3
prompt_ko: "요청 경로를 3개 zone으로 나눠 컴포넌트와 연결을 보여줘. 4:5."
prompt_en: "Show the request path across three zones with components and links. 4:5."
title:
  ko: "요청은 zone을 따라 흐른다"
  en: "Requests flow across the zones"
zones:
  - id: "zone-1"
    label:
      ko: "진입 zone"
      en: "Ingress zone"
    nodes:
      - id: "gw"
        name:
          ko: "게이트웨이"
          en: "Gateway"
        kind: "gateway"
        icon: "route"
      - id: "waf"
        name:
          ko: "방화벽"
          en: "WAF"
        kind: "gateway"
        icon: "shield"
  - id: "zone-2"
    label:
      ko: "애플리케이션 zone"
      en: "Application zone"
    nodes:
      - id: "api"
        name:
          ko: "API 서비스"
          en: "API service"
        kind: "service"
        icon: "server"
      - id: "auth"
        name:
          ko: "인증 서비스"
          en: "Auth service"
        kind: "service"
        icon: "lock"
  - id: "zone-3"
    label:
      ko: "비동기 처리 zone"
      en: "Async processing zone"
    nodes:
      - id: "queue"
        name:
          ko: "메시지 큐"
          en: "Message queue"
        kind: "queue"
        icon: "queue"
edges:
  - { id: "e1", from: "gw", to: "api", kind: "request", delivery: "sync", visibility: "public" }
  - { id: "e2", from: "api", to: "auth", kind: "dependency", delivery: "sync", visibility: "private" }
  - { id: "e3", from: "api", to: "queue", kind: "request", delivery: "async", visibility: "private" }
boundary:
  label:
    ko: "시스템 경계"
    en: "System boundary"
