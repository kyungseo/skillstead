schema_version: 1
kind: typepack-input
typepack: topology-component
case: stress-copy
preset: social-4x5
layout: zones
count: 3
prompt_ko: "zone 라벨을 예산 한계까지 길게 써서 3개 zone으로 보여줘. 4:5."
prompt_en: "Three zones with labels at the copy budget limit. 4:5."
zones:
  - id: "zone-1"
    label:
      ko: "외부 진입과 경계 방어 zone"
      en: "External ingress and edge"
    nodes:
      - id: "gw"
        name:
          ko: "게이트웨이"
          en: "Gateway"
      - id: "waf"
        name:
          ko: "방화벽"
          en: "WAF"
  - id: "zone-2"
    label:
      ko: "애플리케이션 서비스 zone"
      en: "Application service zone"
    nodes:
      - id: "api"
        name:
          ko: "API 서비스"
          en: "API service"
      - id: "auth"
        name:
          ko: "인증 서비스"
          en: "Auth service"
  - id: "zone-3"
    label:
      ko: "영속 데이터 저장 zone"
      en: "Persistent data storage zone"
    nodes:
      - id: "queue"
        name:
          ko: "메시지 큐"
          en: "Message queue"
edges:
  - id: "e1"
    from: "gw"
    to: "api"
    kind: "request"
    delivery: "sync"
    visibility: "public"
  - id: "e2"
    from: "api"
    to: "auth"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
boundary:
  label:
    ko: "시스템 경계"
    en: "System boundary"
