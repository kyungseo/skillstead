schema_version: 1
kind: typepack-input
typepack: topology-component
case: stress-cardinality
preset: social-4x5
layout: zones
count: 4
prompt_ko: "요청 경로를 4개 zone으로 나누고 zone마다 컴포넌트를 채워 보여줘. 4:5."
prompt_en: "Show four zones each filled with components. 4:5."
zones:
  - id: "zone-1"
    label:
      ko: "진입 zone"
      en: "Ingress zone"
    nodes:
      - id: "gw"
        name:
          ko: "게이트웨이"
          en: "Gateway"
      - id: "waf"
        name:
          ko: "방화벽"
          en: "WAF"
  - id: "zone-2"
    label:
      ko: "애플리케이션 zone"
      en: "Application zone"
    nodes:
      - id: "api"
        name:
          ko: "API 서비스"
          en: "API service"
      - id: "auth"
        name:
          ko: "인증 서비스"
          en: "Auth service"
  - id: "zone-3"
    label:
      ko: "비동기 처리 zone"
      en: "Async processing zone"
    nodes:
      - id: "queue"
        name:
          ko: "메시지 큐"
          en: "Message queue"
  - id: "zone-4"
    label:
      ko: "데이터 zone"
      en: "Data zone"
    nodes:
      - id: "db"
        name:
          ko: "기본 데이터베이스"
          en: "Primary database"
      - id: "cache"
        name:
          ko: "캐시"
          en: "Cache"
edges:
  - id: "e1"
    from: "gw"
    to: "api"
    kind: "request"
    delivery: "sync"
    visibility: "public"
  - id: "e2"
    from: "api"
    to: "auth"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
  - id: "e3"
    from: "api"
    to: "queue"
    kind: "dependency"
    delivery: "async"
    visibility: "private"
  - id: "e4"
    from: "queue"
    to: "db"
    kind: "dependency"
    delivery: "async"
    visibility: "private"
boundary:
  label:
    ko: "시스템 경계"
    en: "System boundary"
