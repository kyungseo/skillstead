schema_version: 1
kind: typepack-input
typepack: topology-component
case: stress-cardinality
preset: social-4x5
layout: zones
count: 4
prompt_ko: "요청 경로를 4개 zone으로 나누고 연결을 최대 밀도로 보여줘. 4:5."
prompt_en: "Four zones with the request path at maximum edge density. 4:5."
title:
  ko: "요청은 네 zone을 지난다"
  en: "Requests cross four zones"
zones:
  - id: "zone-1"
    label:
      ko: "진입 zone"
      en: "Ingress zone"
    nodes:
      - id: "gw"
        name:
          ko: "게이트웨이"
          en: "Gateway"
        icon: "route"
      - id: "waf"
        name:
          ko: "방화벽"
          en: "WAF"
        icon: "shield"
  - id: "zone-2"
    label:
      ko: "애플리케이션 zone"
      en: "Application zone"
    nodes:
      - id: "api"
        name:
          ko: "API 서비스"
          en: "API service"
        icon: "server"
      - id: "auth"
        name:
          ko: "인증 서비스"
          en: "Auth service"
        icon: "lock"
      - id: "job"
        name:
          ko: "작업 처리기"
          en: "Job worker"
        icon: "gauge"
  - id: "zone-3"
    label:
      ko: "비동기 처리 zone"
      en: "Async processing zone"
    nodes:
      - id: "queue"
        name:
          ko: "메시지 큐"
          en: "Message queue"
        icon: "queue"
      - id: "stream"
        name:
          ko: "스트림 처리"
          en: "Stream processor"
        icon: "activity"
  - id: "zone-4"
    label:
      ko: "데이터 zone"
      en: "Data zone"
    nodes:
      - id: "db"
        name:
          ko: "기본 데이터베이스"
          en: "Primary database"
        icon: "database"
      - id: "cache"
        name:
          ko: "캐시"
          en: "Cache"
        icon: "layers"
edges:
  - id: "e1"
    from: "gw"
    to: "api"
    kind: "request"
    delivery: "sync"
    visibility: "public"
  - id: "e2"
    from: "gw"
    to: "waf"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
  - id: "e3"
    from: "api"
    to: "auth"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
  - id: "e4"
    from: "api"
    to: "db"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
  - id: "e5"
    from: "api"
    to: "cache"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
  - id: "e6"
    from: "api"
    to: "queue"
    kind: "dependency"
    delivery: "async"
    visibility: "private"
  - id: "e7"
    from: "queue"
    to: "job"
    kind: "dependency"
    delivery: "async"
    visibility: "private"
  - id: "e8"
    from: "job"
    to: "db"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
  - id: "e9"
    from: "queue"
    to: "stream"
    kind: "dependency"
    delivery: "async"
    visibility: "private"
  - id: "e10"
    from: "stream"
    to: "db"
    kind: "dependency"
    delivery: "async"
    visibility: "private"
  - id: "e11"
    from: "auth"
    to: "cache"
    kind: "dependency"
    delivery: "sync"
    visibility: "private"
  - id: "e12"
    from: "waf"
    to: "api"
    kind: "request"
    delivery: "sync"
    visibility: "public"
boundary:
  label:
    ko: "시스템 경계"
    en: "System boundary"
