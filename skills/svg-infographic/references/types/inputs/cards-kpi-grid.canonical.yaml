schema_version: 1
kind: typepack-input
typepack: cards-kpi-grid
case: canonical
preset: document-compact
layout: grid
cols: 2
count: 4
prompt_ko: "핵심 4가지를 동등한 카드로 요약해줘. 소셜 포스트용 4:5 비율."
prompt_en: "Summarise the four key points as equal cards, 4:5 social post."
title:
  ko: "핵심 4가지를 한눈에"
  en: "Four key points at a glance"
cards:
  - id: "observability"
    title:
      ko: "관측 가능성 확보"
      en: "Observability in place"
    body:
      ko: "로그·지표·추적을 한 흐름으로"
      en: "Logs, metrics and traces as one"
    icon: "activity"
  - id: "delivery"
    title:
      ko: "배포 자동화"
      en: "Automated delivery"
    body:
      ko: "검증 통과분만 자동 반영"
      en: "Only verified changes ship"
    icon: "rocket"
  - id: "cost"
    title:
      ko: "비용 가시성"
      en: "Cost visibility"
    body:
      ko: "팀별 사용량을 주간 단위로"
      en: "Weekly per-team usage"
    icon: "coins"
  - id: "security"
    title:
      ko: "보안 기본값"
      en: "Secure defaults"
    body:
      ko: "기본값이 안전하게 동작"
      en: "Safe by default"
    icon: "shield"
