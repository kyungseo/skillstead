schema_version: 2

typepacks:
  - id: summary-cards
    selection_signal: "핵심 항목 3~4개를 카드로 요약"
    profile: constrained-layout
    support: experimental
    spec: compose-fixtures/specs/summary-cards.md
    presets: [social-4x5]
    orientations: [portrait]
    verifier: null
    receipt_schema: null
    fixtures: []
    examples: []
    required_roles: [canvas, surface, ink, muted, rule, focus]
    optional_aliases: []
    canonical_prompt: { status: reserved, anchor: PROMPT-GALLERY.md#summary-cards }
    annexes: []
    gate: null
    migration_origin: new
    legacy_section: null
    fit:
      cardinality: { min: 1, canonical: 1, max: 1 }
      params: { itemMinW: 100, itemMinH: 60, gapX: 0, gapY: 0 }
      footprint:
        - { count: 1, layout: row, w: 100, h: 60 }
      feasibility:
        - { preset: social-4x5, orientation: portrait, count: 1, layout: row, result: fits }
    composition:
      composable: true
      min_slot_size: { w: 640, h: 240 }
      preferred_slot_aspect: { min: 1.8, max: 3.2 }
      allowed_slots: [top, middle]
