schema_version: 2

typepacks:
  - id: fixture-topology
    selection_signal: "fixture-only: layered request/flow topology"
    profile: constrained-layout
    support: experimental
    spec: skin-fixtures/types/fixture-spec.md
    presets: [social-4x5, presentation-16x9]
    preferred_preset: social-4x5
    orientations: [portrait, landscape]
    verifier: null
    receipt_schema: null
    fixtures:
      - { id: fx-1, kind: positive, preset: social-4x5, path: skin-fixtures/portable-positive.svg }
    examples: []
    required_roles: [canvas, surface, ink, muted, rule, focus]
    optional_aliases: [edge, compute, data]
    canonical_prompt: { status: reserved, anchor: PROMPT-GALLERY.md#fixture-topology }
    annexes: []
    gate: null
    migration_origin: new
    legacy_section: null
    inputs:
      canonical: { id: fixture-topology-canonical, path: skin-fixtures/inputs/fixture-topology.canonical.yaml, preset: social-4x5, layout: row, count: 1 }
      stress:
        - id: fixture-topology-stress-cardinality
          path: skin-fixtures/inputs/fixture-topology.stress-cardinality.yaml
          preset: social-4x5
          layout: row
          count: 1
          geometry_expected: fits
          covers: [cardinality-max]
    fit:
      floor_basis: geometry
      cardinality: { min: 1, canonical: 1, max: 1 }
      params: { itemMinW: 100, itemMinH: 60, gapX: 0, gapY: 0 }
      footprint:
        - { count: 1, layout: row, w: 100, h: 60 }
      feasibility:
        - { preset: social-4x5, orientation: portrait, count: 1, layout: row, result: fits }
        - { preset: presentation-16x9, orientation: landscape, count: 1, layout: row, result: fits }
